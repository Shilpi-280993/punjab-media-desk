<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Punjab Media Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: header bar, segmented tabs, then Calendar / Data / Pending. PCs are blue, CM PCs are purple, events are teal; green done, amber pending, red overdue. */
:root{
  --bg:#f4f6f9; --surface:#ffffff; --fg:#1d2733; --muted:#5f6b7a; --line:#dde3ea; --soft:#eef1f5;
  --brand:#1f3a5f; --brand-fg:#ffffff;
  --pc:#2f5bd3; --pc-bg:#e9efff; --ev:#0f8a7e; --ev-bg:#e3f5f2; --cm:#7a2fc2; --cm-bg:#f2e8fd; --cm-fg:#ffffff;
  --ok:#1e7f43; --ok-bg:#dff3e6; --wait:#a15c00; --wait-bg:#fff1d6; --late:#c0352b; --late-bg:#fde4e1; --na:#8a94a3; --na-bg:#eef0f3;
  --sans:"Source Sans 3","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  --r:8px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#12171e; --surface:#1a212b; --fg:#e6ebf1; --muted:#9aa6b4; --line:#2e3946; --soft:#222b36;
  --brand:#24456f; --brand-fg:#ffffff;
  --pc:#8fb0ff; --pc-bg:#1e2a4a; --ev:#5fd0c3; --ev-bg:#16332f; --cm:#c9a2ff; --cm-bg:#2f2145; --cm-fg:#241433;
  --ok:#6fd497; --ok-bg:#173524; --wait:#f2b55a; --wait-bg:#3a2a10; --late:#ff8a80; --late-bg:#3f1d1a; --na:#8792a0; --na-bg:#252d37; color-scheme:dark}}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.45;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3{margin:0;font-weight:700;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pc);outline-offset:2px}
[hidden]{display:none!important}
.muted{color:var(--muted)} .small{font-size:.86rem} .num{font-variant-numeric:tabular-nums}

.topbar{background:var(--brand);color:var(--brand-fg)}
.topbar .in{max-width:1800px;margin:0 auto;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between}
.topbar h1{font-size:1.45rem;letter-spacing:.01em}
.topbar .sub{font-size:.88rem;opacity:.8}
.topbar .actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 14px;border-radius:var(--r);font-weight:600}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--pc);border-color:var(--pc);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.topbar .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.35);color:#fff}
.topbar .btn.primary{background:#fff;color:var(--brand);border-color:#fff}
.btn.sm{padding:4px 10px;font-size:.88rem}
.btn:disabled{opacity:.45;cursor:not-allowed}

.wrap{max-width:1800px;margin:0 auto;padding-block:16px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.navrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.tabs{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.tabs button{border:none;background:none;padding:6px 16px;border-radius:999px;color:var(--muted);font-weight:600}
.tabs .tablink{padding:6px 16px;border-radius:999px;color:var(--muted);font-weight:600;text-decoration:none;display:inline-flex;align-items:center}
.tabs .tablink:hover{color:var(--fg);background:var(--surface)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tabs .count{display:inline-block;min-width:20px;padding:0 6px;margin-left:4px;border-radius:999px;background:var(--wait-bg);color:var(--wait);font-size:.75rem}
.navl{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tabs .pcn{margin-left:5px;font-size:.78rem;opacity:.75;font-variant-numeric:tabular-nums}
#pcTabs button[data-f="cm"][aria-selected="true"]{background:var(--cm);color:var(--cm-fg)}
.conn{font-size:.85rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.conn i{width:8px;height:8px;border-radius:50%;background:var(--na);display:inline-block}
.conn.ok i{background:var(--ok)} .conn.bad i{background:var(--late)}

.view{display:grid;gap:14px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.bar .left{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input[type=date],input[type=time],input[type=text],input[type=search],input[type=url],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 8px;min-width:0}
textarea{width:100%;min-height:60px}
.empty{color:var(--muted);padding:6px 0}
.brief{border:1px solid var(--line);border-left:4px solid var(--pc);background:var(--surface);border-radius:var(--r);padding:10px 14px;white-space:pre-wrap;font-size:.94rem}
.brief summary{cursor:pointer;font-weight:700}

/* tags and status pills */
.tag{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:0 6px;border-radius:4px;vertical-align:1px}
.tag.pc{background:var(--pc-bg);color:var(--pc)} .tag.ev{background:var(--ev-bg);color:var(--ev)} .tag.cmpc{background:var(--cm);color:var(--cm-fg)}
.tag.cf{letter-spacing:.02em;text-transform:none;font-weight:600} .tag.cf.conf{background:var(--ok);color:#fff} .tag.cf.tent{background:transparent;color:var(--wait);border:1px dashed var(--wait)}
.chip.tent{outline:1.5px dashed var(--wait);outline-offset:-1px}
select.csel{display:block;margin-top:4px;font-size:.75rem;padding:2px 4px;width:100%} select.csel.conf{border-color:var(--ok);color:var(--ok)} select.csel.tent{border-style:dashed;border-color:var(--wait);color:var(--wait)}
.marks{display:inline-flex;gap:3px;flex-wrap:wrap}
.mk{display:inline-block;font-size:.66rem;font-weight:700;min-width:22px;text-align:center;border-radius:4px;padding:0 3px;line-height:1.45}
.mk.done{background:var(--ok-bg);color:var(--ok)}
.mk.open{background:var(--wait-bg);color:var(--wait)}
.mk.late{background:var(--late-bg);color:var(--late)}
.mk.na{background:var(--na-bg);color:var(--na);text-decoration:line-through}
.legend{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:.82rem;color:var(--muted)}
.legend span{display:inline-flex;gap:4px;align-items:center}
.sw{width:11px;height:11px;border-radius:3px;display:inline-block}
.sw.done{background:var(--ok)} .sw.open{background:var(--wait)} .sw.late{background:var(--late)} .sw.na{background:var(--na)}
.sw.wk{border:1px dashed var(--muted)}

/* calendar */
.calnav h2{min-width:180px;text-align:center;font-size:1.25rem}
.calwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));min-width:680px;user-select:none;-webkit-user-select:none}
.cal .dow{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:8px;border-bottom:1px solid var(--line);font-weight:700;background:var(--soft)}
.cal .day{min-height:124px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:5px}
.cal .day:nth-child(7n+7){border-right:none}
.cal .day.out{background:var(--bg)} .cal .day.out .d{color:var(--na)}
.cal .day.wkend:not(.out){background:color-mix(in srgb,var(--soft) 45%,var(--surface))}
.cal .day.today{box-shadow:inset 0 0 0 2px var(--pc)}
.cal .day.today .d{background:var(--pc);color:#fff;border-radius:999px;padding:0 7px}
.cal .day.drop{background:var(--pc-bg);box-shadow:inset 0 0 0 2px var(--pc)}
.cal .dh{display:flex;justify-content:space-between;align-items:center}
.cal .d{font-size:.88rem;font-weight:700;font-variant-numeric:tabular-nums}
.cal .add{background:none;border:1px solid var(--line);border-radius:4px;color:var(--muted);font-size:.9rem;line-height:1;padding:2px 7px;opacity:0}
.cal .day:hover .add,.cal .add:focus-visible{opacity:1}
@media (hover:none){.cal .add{opacity:1}}
.chip{position:relative;display:grid;gap:3px;border:1px solid transparent;border-left:4px solid var(--pc);border-radius:6px;padding:4px 6px;background:var(--pc-bg);font-size:.8rem;line-height:1.25;cursor:grab;text-align:left;width:100%;touch-action:manipulation;color:var(--fg)}
.chip.ev{border-left-color:var(--ev);background:var(--ev-bg)}
.chip.cmpc{border-left-color:var(--cm);background:var(--cm-bg)}
.chip.late{border-color:var(--late);border-left-color:var(--late)}
.chip:hover{filter:brightness(.98);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.chip .ct{padding-right:20px;font-weight:700;white-space:normal;overflow-wrap:anywhere}
.chip .cm{color:var(--muted);font-size:.74rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .dn{position:absolute;top:3px;right:3px;width:16px;height:16px;border:1.5px solid var(--na);border-radius:4px;display:grid;place-items:center;font-size:.68rem;line-height:1;color:transparent;background:var(--surface);cursor:pointer}
.chip .dn:hover{border-color:var(--ok);color:var(--ok)}
.chip .dn.on{background:var(--ok);border-color:var(--ok);color:#fff}
.chip.wk{border:1px dashed var(--line);border-left:4px solid var(--pc);padding:2px 5px}
.chip.wk.ev{border-left-color:var(--ev)}
.chip.wk.cmpc{border-left-color:var(--cm)}
.chip.inactive,.chip.bl.inactive,.chip.wk.inactive{background:var(--soft);border-left-color:var(--na);opacity:.6;filter:grayscale(1)}
.chip.inactive .ct{text-decoration:line-through}
.wkh{font-size:.68rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.wkbox{display:grid;gap:3px;max-height:190px;overflow-y:auto;align-content:start}
.chip.dragging{opacity:.35}
.ghost-chip{position:fixed;pointer-events:none;z-index:50;box-shadow:0 8px 22px rgba(0,0,0,.25);width:170px;cursor:grabbing}

/* calendar + to-schedule list */
.calgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
@media (max-width:1100px){.calgrid{grid-template-columns:minmax(0,1fr)}}
.backlog{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:10px;display:grid;gap:8px;position:sticky;top:10px;max-height:calc(100vh - 30px);grid-template-rows:auto auto minmax(0,1fr)}
@media (max-width:1100px){.backlog{position:static;max-height:none}}
.backlog.drop{box-shadow:inset 0 0 0 2px var(--pc);background:var(--pc-bg)}
.backlog header{display:flex;justify-content:space-between;align-items:center}
.backlog h3{font-size:1.02rem}
.blf{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.blf input[type=search]{grid-column:1/-1}
.blf select{grid-column:1/-1;font-size:.85rem;padding:4px 6px}
.blf label{grid-column:1/-1;display:flex;gap:6px;align-items:center;color:var(--muted)}
.blist{overflow-y:auto;display:grid;gap:6px;align-content:start;padding-right:2px}
@media (max-width:1100px){.blist{max-height:420px}}
.blwk{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:6px}
.chip.bl{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--pc)}
.chip.bl.ev{border-left-color:var(--ev)}
.chip.bl.cmpc{border-left-color:var(--cm);background:var(--cm-bg)}
.chip.bl.closed{opacity:.6}
.chip .cm{white-space:nowrap}
.fchips{display:flex;flex-wrap:wrap;gap:3px}
.fchip{font-size:.66rem;font-weight:600;padding:0 5px;border-radius:999px;background:var(--soft);color:var(--muted)}

/* data table */
.tbl-wrap{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--soft);white-space:nowrap;position:sticky;top:0;z-index:1}
tbody tr:hover{background:var(--soft)}
tbody tr.cmpc{background:var(--cm-bg)}
tbody tr.cmpc td:first-child{box-shadow:inset 4px 0 0 var(--cm)}
tbody tr.inactive{background:none}
tbody tr.inactive td{opacity:.5}
tbody tr.inactive td:first-child{box-shadow:inset 4px 0 0 var(--na)}
td input,td select{width:100%;font-size:.86rem;padding:4px 5px}
td.w-type{min-width:92px}td.w-date{min-width:140px}td.w-time{min-width:100px}td.w-title{min-width:220px}td.w-mid{min-width:140px}td.w-st{min-width:118px}td.w-link{min-width:160px}
select.s-done{background:var(--ok-bg);color:var(--ok);border-color:transparent;font-weight:600}
select.s-open{background:var(--wait-bg);color:var(--wait);border-color:transparent;font-weight:600}
select.s-late{background:var(--late-bg);color:var(--late);border-color:transparent;font-weight:600}
select.s-na{background:var(--na-bg);color:var(--na);border-color:transparent}
.x{background:none;border:none;color:var(--pc);font-size:.88rem;padding:0;font-weight:600}

/* pending */
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}
.pcol{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 12px;display:grid;gap:4px;align-content:start}
.pcol header{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.pcol h3{font-size:1rem}
.pill{font-size:.75rem;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--wait-bg);color:var(--wait);white-space:nowrap}
.pill.zero{background:var(--ok-bg);color:var(--ok)}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:5px 0;border-top:1px solid var(--soft)}
.prow:first-of-type{border-top:none}
.prow .pt{min-width:0;cursor:pointer}
.prow .pt b{display:block;white-space:normal;overflow-wrap:anywhere;font-size:.93rem}
.prow small{color:var(--muted)}
.prow select{font-size:.85rem;padding:3px 5px}
.lateword{color:var(--late);font-weight:700}

/* dialog */
dialog{border:none;border-radius:12px;padding:0;width:min(760px,calc(100vw - 24px));max-height:calc(100vh - 40px);background:var(--surface);color:var(--fg);box-shadow:0 20px 50px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(15,23,35,.5)}
.dlg{padding:18px 20px;display:grid;gap:14px}
.dlg .dhd{display:flex;justify-content:space-between;align-items:center;gap:10px}
.typesw{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;padding:2px;gap:2px;background:var(--soft)}
.typesw button{border:none;background:none;padding:5px 16px;border-radius:999px;font-weight:600;color:var(--muted)}
.typesw button[data-t="PC"][aria-pressed="true"]{background:var(--pc);color:#fff}
.typesw button[data-t="Event"][aria-pressed="true"]{background:var(--ev);color:#fff}
.typesw button[data-t="CM PC"][aria-pressed="true"]{background:var(--cm);color:var(--cm-fg)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.form label{display:grid;gap:3px;font-size:.82rem;color:var(--muted);font-weight:600}
.form .full{grid-column:1/-1}
.form input,.form select,.form textarea{color:var(--fg);font-size:.97rem;font-weight:400}
.title-in{font-size:1.2rem!important;font-weight:700!important}
.phase{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding-bottom:3px;margin-top:6px;border-bottom:1px solid var(--line)}
.srow{display:grid;grid-template-columns:minmax(0,1fr) 170px;gap:6px 12px;align-items:center;padding:5px 0}
.srow .sl{font-weight:600}
.srow .sl small{display:block;color:var(--muted);font-size:.8rem;font-weight:400}
.srow .lk{grid-column:1/-1}
.srow .lk input{width:100%;font-size:.88rem}
@media (max-width:560px){.form{grid-template-columns:1fr}.srow{grid-template-columns:1fr}}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.confirm{border:1px solid var(--late);background:var(--late-bg);padding:10px;border-radius:var(--r);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn.doneb{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{background:var(--late);border-color:var(--late);color:#fff}

/* sub-parts toggles */
.subparts{display:grid;gap:8px}
.sp{display:flex;flex-wrap:wrap;gap:8px}
.spb{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 13px;font-weight:600;font-size:.92rem}
.spb .tick{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--line);display:inline-grid;place-items:center;font-size:.72rem;line-height:1}
.spb[aria-pressed="true"]{background:var(--pc-bg);border-color:var(--pc);color:var(--pc)}
.spb[aria-pressed="true"] .tick{background:var(--pc);border-color:var(--pc);color:#fff}
.spb[aria-pressed="true"] .tick::after{content:"✓"}
td.w-ck{text-align:center;min-width:64px}
.tbl-wrap td{vertical-align:top}
td.w-desc{min-width:190px} td.w-req{min-width:185px} td.w-steps{min-width:190px}
.tbl-wrap th,.tbl-wrap td{padding:5px 4px}
td.w-wk{min-width:110px;width:110px} .tbl-wrap td.w-date{min-width:122px;width:122px} .tbl-wrap td.w-title{min-width:150px;width:170px} td.w-sp{min-width:86px} .tbl-wrap td.w-st{min-width:104px}
td.w-tp{min-width:84px;width:84px}
.racts{display:grid;gap:6px;justify-items:start}
.optdlg{border:1px solid var(--line);border-radius:14px;padding:0;max-width:440px;width:calc(100% - 32px);background:var(--surface);color:inherit}
.optdlg::backdrop{background:rgba(0,0,0,.35)}
.optbox{padding:16px;display:grid;gap:10px}.optbox header{display:flex;justify-content:space-between;align-items:center}.optbox h3{margin:0}
.optlist{margin:0;padding-left:22px;display:grid;gap:4px;max-height:50vh;overflow:auto}.optlist li{padding:2px 0}
.optlist li{display:list-item}.optlist li>span:first-child{display:inline-block;min-width:60%}.optbtns{float:right;display:inline-flex;gap:4px}
.optadd{display:flex;gap:8px}.optadd input{flex:1}.optfoot{text-align:right}
body.tvcview #pcTabs,body.tvcview #pocF,body.tvcview .navl>.wkf{display:none}
.tvc td{vertical-align:top}
.tvc td.c-dur{min-width:160px;width:170px} .tvc td.c-camp{min-width:200px} .tvc td.c-slots{min-width:76px;width:84px} .tvc td.c-kind{min-width:110px;width:118px} .tvc td.c-films{min-width:130px;width:150px} .tvc td.c-ck{text-align:center;min-width:112px;width:120px} .tvc td.c-rem{min-width:240px}
.tvc td{padding:7px 6px}
.tvc td.c-camp textarea{font-weight:700;font-size:.92rem}
.tvc td.c-slots input,.tvc td.c-films input{text-align:center}
.tvc tbody tr:not(.grp) td:first-child{box-shadow:inset 4px 0 0 var(--line)}
.tvc tr.onair td:first-child{box-shadow:inset 4px 0 0 var(--ok)!important}
.tvc tr.ended td{opacity:.55}
.tvc tr.grp td{background:var(--soft);font-weight:700;font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;padding:9px 10px;border-top:2px solid var(--line)}
.tvc tr.grp td span{font-weight:500;text-transform:none;letter-spacing:0;color:var(--muted);margin-left:10px}
.tvc tr.grp.g-National td{color:var(--pc)} .tvc tr.grp.g-Regional td{color:var(--ev)}
.tick{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);cursor:pointer;font-size:.8rem;color:var(--muted);background:var(--surface);white-space:nowrap}
.tick input{width:15px!important;height:15px;margin:0;flex:none}
#tKind button[data-k="National"][aria-selected="true"]{background:var(--pc);color:#fff}
#tKind button[data-k="Regional"][aria-selected="true"]{background:var(--ev);color:#fff}
#tKind .pcn{margin-left:6px;font-size:.78rem;opacity:.8}
.tick.on{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:700}
.air{display:inline-block;margin-top:4px;font-size:.72rem;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--soft);color:var(--muted)}
.air.on{background:var(--ok);color:#fff} .air.soon{background:var(--wait-bg);color:var(--wait)}
.tvcsum{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.tvcsum .card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:grid;gap:2px}
.tvcsum .card b{font-size:1.45rem;line-height:1.1}
.tvcsum .card span{font-size:.8rem;color:var(--muted)}
.tvcsum .card.ok b{color:var(--ok)}
.x.del{color:var(--late)}
.x.del.arm{font-weight:700;background:var(--late);color:#fff;border-radius:6px;padding:2px 6px}
select.tsel{font-weight:700;border-radius:999px;padding:3px 6px}
select.tsel.t-pc{background:var(--pc-bg);color:var(--pc);border-color:var(--pc)}

td textarea.wrap{width:100%;font:inherit;font-size:.86rem;line-height:1.35;padding:4px 5px;resize:vertical;field-sizing:content;min-height:2.3em}

.reqs,.steps{display:grid;gap:3px}

.rq{flex-wrap:wrap} .rq .rqd{flex-basis:100%;margin:1px 0 3px 8px;font-size:.75rem;padding:1px 4px;max-width:150px} .rq .rqd.empty{opacity:.55}
.rqdates{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px 10px;margin-top:8px} .rqdates label{display:grid;gap:2px;font-size:.85rem}
.fusum{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.9rem}
.fuday{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 12px;display:grid;gap:2px}
.fuday header{display:flex;gap:10px;align-items:baseline;padding-bottom:4px;border-bottom:1px solid var(--line)} .fuday h3{font-size:1rem;margin:0} .fuday header small{color:var(--muted)}
.fuday.past h3{color:var(--late)} .fuday.today{border-color:var(--pc)}
.furow{display:grid;grid-template-columns:minmax(150px,200px) minmax(0,1fr) auto;gap:10px;align-items:center;padding:5px 0;border-top:1px solid var(--soft)}
.furow:first-of-type{border-top:none} .furow .fuck{display:flex;gap:6px;align-items:center;font-weight:600;cursor:pointer}
.furow .fuck input{width:auto;margin:0} .furow .pt{min-width:0;cursor:pointer} .furow .pt b{display:block;overflow-wrap:anywhere;font-size:.93rem} .furow .pt small{color:var(--muted)}
.furow input[type=date]{font-size:.8rem;padding:2px 4px} .furow.done .fuck span,.furow.done .pt b{text-decoration:line-through;color:var(--muted)} .furow.late .fuck{color:var(--late)}
@media (max-width:640px){.furow{grid-template-columns:1fr auto}.furow .pt{grid-column:1/-1;order:3}}
.rq label{flex:1;display:flex;gap:6px;align-items:center;font-size:.85rem;cursor:pointer;padding:2px 5px;border-radius:6px;background:var(--soft);border-left:3px solid var(--wait)}
.rq label small{color:var(--muted);font-size:.72rem}
.rq.done label{border-left-color:var(--ok)}

.rq input[type=checkbox],.stp input[type=checkbox]{width:auto;flex:none;margin:0}
.stp input[type=checkbox]{margin-top:7px}
.stp textarea.wrap{min-height:2em}
.stp.done textarea{text-decoration:line-through;opacity:.6}
.rx{flex:none;border:0;background:none;color:var(--muted);cursor:pointer;font-size:1.05rem;line-height:1;padding:3px 4px}
.rx:hover{color:var(--late)}
td .radd,td .sadd,.steps .sadd{font-size:.82rem;padding:3px 5px}
.wkf{position:relative}
.wkf summary{list-style:none;cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:.9rem;background:var(--surface);white-space:nowrap}

.wkmenu{position:absolute;z-index:30;top:calc(100% + 4px);left:0;min-width:230px;max-width:calc(100vw - 32px);max-height:340px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:6px;display:grid;gap:2px}

.wkmenu label:hover{background:var(--soft)}
.wkmenu small{color:var(--muted)}
.wkact{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 6px;border-bottom:1px solid var(--line);margin-bottom:4px;font-size:.8rem;color:var(--muted)}
td.w-ck input{width:18px;height:18px;accent-color:var(--pc)}

/* setup */
.setup{max-width:620px;margin:20px auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;display:grid;gap:12px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:.92rem;z-index:60;display:flex;gap:12px;align-items:center;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.toast button{background:none;border:none;color:inherit;text-decoration:underline;padding:0;font-weight:700}

<body>
<div class="topbar"><div class="in">
  <div><h1>Punjab Media Desk</h1><div class="sub">PCs and events on one calendar</div></div>
  <div class="actions">
    <button class="btn primary" id="btnNew" type="button">+ Add PC or Event</button>
    <button class="btn" id="btnExport" type="button">Export to Excel</button>
    <button class="btn" id="btnShare" type="button">Copy team link</button>
  </div>
</div></div>

<div class="wrap">
  <div class="navrow">
    <div class="navl">
    <div class="tabs" role="tablist" id="tabs">
      <button role="tab" data-v="calendar" aria-selected="true" type="button">Calendar</button>
      <button role="tab" data-v="pending" aria-selected="false" type="button">Pending<span class="count" id="pendCount" hidden></span></button>
      <button role="tab" data-v="followups" aria-selected="false" type="button">Follow-ups</button>
      <button role="tab" data-v="data" aria-selected="false" type="button">Data</button>
      <button role="tab" data-v="tvc" aria-selected="false" type="button">TVC</button>
      <a class="tablink" id="sheetTab" href="" target="_blank" rel="noopener" title="Open the Google Sheet in a new tab">Google Sheet ↗</a>
    </div>
    <div class="tabs" role="tablist" aria-label="Filter by PC type" id="pcTabs">
      <button role="tab" data-f="minister" aria-selected="false" type="button">Minister PC<span class="pcn" id="pcn-minister"></span></button>
      <button role="tab" data-f="cm" aria-selected="false" type="button">CM PC<span class="pcn" id="pcn-cm"></span></button>
      <button role="tab" data-f="all" aria-selected="true" type="button">All<span class="pcn" id="pcn-all"></span></button>
    </div>
    <select id="pocF" aria-label="Filter by POC"><option value="">All POCs</option></select>
    <details class="wkf" id="wkF"><summary>Target week<span class="wkn"></span></summary><div class="wkmenu"></div></details>
    </div>
    <div class="conn" id="conn"><i></i><span>Connecting…</span></div>
  </div>
  <main id="main"></main>
</div>

<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<div class="toast" id="toast" hidden></div>

<script>
/* ---------- Tracked items ---------- */
const DONE3=["Pending","Done","NA"], REC3=["Pending","Received","NA"], LIVE3=["Not needed","Pending","Done"];
const ADS=["None","Size TBD","Half page","Full page"];
const OVERALL=["Pending","Done","To be done by CM","Dropped","Archived"];
const ITEMS=[
  {k:"onePager",short:"OP",label:"One pager",owner:"Department",phase:"Before",opts:REC3,off:-1,when:a=>true},
  {k:"adCoord",short:"AD",label:"Ad coordinated with parent department",owner:"Parent department",phase:"Before",opts:DONE3,off:-1,when:a=>a.printAd&&a.printAd!=="None"},
  {k:"calendarPosted",short:"CAL",label:"Calendar posted (Ministers group, Media execution call)",owner:"",phase:"Before",opts:DONE3,off:-1,when:a=>true},
  {k:"live",short:"LV",label:"Live",owner:"",phase:"On the day",opts:LIVE3,off:0,when:a=>a.type==="Event"},
  {k:"bytes",short:"BY",label:"Bytes recorded",owner:"",phase:"On the day",opts:LIVE3,off:0,when:a=>a.type==="Event"},
  {k:"pr",short:"PR",label:"PR happened",owner:"Pritam",phase:"On the day",opts:DONE3,off:0,when:a=>true},
  {k:"digital",short:"DG",label:"Digital coverage report",owner:"AJ",phase:"Dissemination",opts:DONE3,off:1,link:"digitalLink",when:a=>true},
  {k:"social",short:"SM",label:"Social media report",owner:"Akash",phase:"Dissemination",opts:DONE3,off:1,link:"socialLink",when:a=>true},
];
const CHIP_MARKS=["onePager","pr","digital","social"];
const OPT_LABEL={NA:"Not applicable"};
const FIELDS=["id","type","date","time","title","minister","venue","district","context","printAd",...ITEMS.map(i=>i.k),"digitalLink","socialLink","remarks","createdAt","updatedAt","sector","poc","status","week","timing","formats"];
function dflt(it){return it.opts===LIVE3?"Not needed":"Pending"}
function v(a,it){return a[it.k]||dflt(it)}
function applicable(a){return ITEMS.filter(i=>i.when(a))}
function isArchived(a){return /^archived$/i.test(a.status||"")}
function isClosed(a){return /^(done|dropped|archived)$/i.test(a.status||"")||/^inaugurated/i.test(a.week||"")}
function stateOf(a,it){if(!itOn(a,it))return"na";const x=v(a,it);if(x==="Pending")return a.date&&addDays(a.date,it.off)<TODAY?"late":"open";if(x==="NA"||x==="Not needed")return"na";return"done"}
function isOpen(a,it){return itOn(a,it)&&v(a,it)==="Pending"}
function isLate(a){return !isClosed(a)&&applicable(a).some(it=>stateOf(a,it)==="late")}

/* ---------- Dates ---------- */
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function parse(s){const [y,m,d]=String(s).split("-").map(Number);return new Date(y,(m||1)-1,d||1)}
function addDays(s,n){const d=parse(s);d.setDate(d.getDate()+n);return iso(d)}
const TODAY=iso(new Date());
function fmt(s,o){if(!s)return"";return parse(s).toLocaleDateString("en-IN",o||{day:"numeric",month:"short",year:"numeric"})}
function daysBetween(a,b){return Math.round((parse(b)-parse(a))/86400000)}

/* ---------- Connection to the Google Sheet ---------- */
const CFG="pmd-config";
const DEFAULT_API="https://script.google.com/macros/s/AKfycbx1nzgt0wnpQb7DXRtZmqZIQyiP8DUPX4NdiwMm64Ye82rALAGdSpc1hsSW94j7Ae_3/exec";
const DEFAULT_SHEET="https://docs.google.com/spreadsheets/d/1emGY4R9dw5iLTGekdcrNFrh5nmiKW-CsbgMQHidHoYQ/edit";
function loadCfg(){try{return JSON.parse(localStorage.getItem(CFG)||"null")}catch(e){return null}}
function storeCfg(c){try{localStorage.setItem(CFG,JSON.stringify(c))}catch(e){}}
/* Put the part of the team link after #setup= between the quotes to open the dashboard to everyone with the plain link. Anyone can then view and edit. */
const TEAM_CODE="aHR0cHM6Ly9zY3JpcHQuZ29vZ2xlLmNvbS9tYWNyb3Mvcy9BS2Z5Y2J4MW56Z3Qwd25wUWI3RFhSdFptcVpJUXlpUDhEVVBYNE5kaXdNbTY0WWU4MnJBTEFHZFNwYzFoc1NXOTRqN0FlXzMvZXhlY3xwbWQtSWlZWmVJaG5GM21OR2Vkcw";
function fromCode(c){try{const [api,k]=atob(c.replace(/-/g,"+").replace(/_/g,"/")).split("|");return api&&k?{api,k,sheet:DEFAULT_SHEET}:null}catch(e){return null}}
const OPEN_CFG=TEAM_CODE?fromCode(TEAM_CODE):null;
let cfg=OPEN_CFG||loadCfg();
(function readHash(){const m=location.hash.match(/setup=([A-Za-z0-9_\-]+)/);if(!m)return;
  try{const s=atob(m[1].replace(/-/g,"+").replace(/_/g,"/"));const [api,k]=s.split("|");if(api&&k){cfg={api,k,sheet:DEFAULT_SHEET};storeCfg(cfg)}}catch(e){}
  history.replaceState(null,"",location.pathname+location.search)})();
function teamLink(){const s=btoa(cfg.api+"|"+cfg.k).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");return location.origin+location.pathname+"#setup="+s}

async function apiGet(){const r=await fetch(cfg.api+"?k="+encodeURIComponent(cfg.k),{cache:"no-store"});return r.json()}
async function apiPost(body){const r=await fetch(cfg.api,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({...body,k:cfg.k})});return r.json()}

/* ---------- State ---------- */
const state={acts:[],briefs:{},view:"calendar",pcf:"all",poc:"",weeks:[],month:TODAY.slice(0,7),q:"",dataScope:"all",dstat:"",tvc:[],tvcKind:"",fuDone:false};
let pendingWrites=0,writeChain=Promise.resolve(),loaded=false;
/* The Sheet has no Next steps column, so steps are kept at the end of Remarks under a marker line: [ ] open, [x] done. */
const NS_MARK="--- Next steps ---";
function splitRem(r){r=String(r||"");const i=r.indexOf(NS_MARK);if(i<0)return{rem:r,steps:[]};
  const steps=r.slice(i+NS_MARK.length).split("\n").map(l=>l.match(/^\s*\[( |x)\]\s?(.*)$/i)).filter(Boolean).map(m=>({done:m[1].toLowerCase()==="x",text:m[2].trim()})).filter(s=>s.text);
  return{rem:r.slice(0,i).replace(/\s+$/,""),steps}}
function joinRem(rem,steps){rem=String(rem||"").replace(/\s+$/,"");if(!steps.length)return rem;
  return (rem?rem+"\n\n":"")+NS_MARK+"\n"+steps.map(s=>`[${s.done?"x":" "}] ${s.text}`).join("\n")}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function uid(p){return p+"-"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function toast(msg,undo){const t=document.getElementById("toast");t.innerHTML="";const s=document.createElement("span");s.textContent=msg;t.append(s);
  if(undo){const b=document.createElement("button");b.type="button";b.textContent="Undo";b.onclick=()=>{t.hidden=true;undo()};t.append(b)}
  t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,undo?5000:2400)}
function setConn(text,kind){const c=document.getElementById("conn");c.className="conn "+(kind||"");c.querySelector("span").textContent=text}

const saveSeq={};let seqN=0;
function queue(body){
  pendingWrites++;setConn("Saving…");
  const rid=body.op==="save"&&body.row&&body.row.id,my=++seqN;if(rid)saveSeq[rid]=my;
  writeChain=writeChain.then(()=>rid&&saveSeq[rid]!==my?{ok:true}:apiPost(body)).then(r=>{if(!r||r.error)throw new Error(r&&r.error||"failed")})
    .catch(()=>{toast("Could not save to the Sheet. Check your connection; your last change may be lost.");setConn("Last change not saved","bad")})
    .finally(()=>{pendingWrites--;if(!pendingWrites){setConn("Saved to Google Sheet","ok");setTimeout(refresh,800)}});
}
/* A leading apostrophe makes Google Sheets store the value as plain text, so dates and times are not converted */
function clean(a){const o={};FIELDS.forEach(f=>{const x=String(a[f]??"");o[f]=x&&f!=="id"?"'"+x:x});return o}
function normDate(s){s=String(s||"").trim();if(!s||/^\d{4}-\d{2}-\d{2}$/.test(s))return s;const d=new Date(s);return isNaN(d)?s:iso(d)}
function normTime(s){s=String(s||"").trim();if(!s||/^\d{1,2}:\d{2}$/.test(s))return s;const m=s.match(/(\d{1,2}):(\d{2}):\d{2}/);return m?m[1].padStart(2,"0")+":"+m[2]:s}
function save(a){a.updatedAt=new Date().toISOString();const i=state.acts.findIndex(x=>x.id===a.id);if(i>=0)state.acts[i]=a;else state.acts.push(a);if(i>=0&&!dlg.open&&quickRow(a))drawChrome();else render();queue({op:"save",row:clean(a)})}
function patch(id,p){const a=state.acts.find(x=>x.id===id);if(!a)return;save({...a,...p})}
function remove(id){state.acts=state.acts.filter(a=>a.id!==id);render();queue({op:"delete",id})}
function blank(type,date){const a={id:uid(type==="PC"?"pc":"ev"),type,date:date||TODAY,time:"",title:"",minister:"",venue:"",district:"",context:"",printAd:"None",digitalLink:"",socialLink:"",remarks:"",createdAt:new Date().toISOString()};
  return a}

let lastSig="",rowSigs=new Map();
async function refresh(){
  if(!cfg||pendingWrites||(drag&&drag.active))return;
  try{const r=await apiGet();if(r.error==="key"){setConn("Wrong desk key","bad");if(!loaded)showSetup("The desk key was not accepted. Check it and try again.");return}
    if(pendingWrites)return;
    const sig=JSON.stringify(r.acts||[]);
    if(loaded&&sig===lastSig){setConn("Connected to Google Sheet","ok");return}
    lastSig=sig;
    const allRows=(r.acts||[]).filter(a=>a.id).map(a=>({...a,date:normDate(a.date),time:normTime(a.time)}));
    const conf=allRows.find(a=>a.type==="Config"),newF=readConfig(conf),fChanged=newF.join("|")!==FORMATS.join("|");state.config=conf||null;FORMATS=newF;
    const newActs=allRows.filter(a=>a.type!=="TVC"&&a.type!=="Config"),newSigs=new Map(newActs.map(a=>[a.id,JSON.stringify(a)]));
    let sameSet=newActs.length===state.acts.length&&newActs.every(a=>rowSigs.has(a.id));const changed=sameSet?newActs.filter(a=>rowSigs.get(a.id)!==newSigs.get(a.id)):[];
    rowSigs=newSigs;state.tvc=allRows.filter(a=>a.type==="TVC");state.acts=newActs;state.briefs=r.briefs||{};
    const first=!loaded;loaded=true;setConn("Connected to Google Sheet","ok");
    if(!first&&!fChanged&&sameSet&&state.view==="data"&&!dlg.open&&changed.length<=25){
      const f=document.activeElement;changed.forEach(a=>{const old=document.getElementById("r-"+a.id+"-week");const tr=old&&old.closest("tr");if(tr&&!(f&&tr.contains(f)))quickRow(a)});drawChrome();return}
    if(first||!busyTyping())render()}
  catch(e){setConn(loaded?"Offline. Showing last loaded data":"Can't reach the Google Sheet","bad");if(!loaded)showSetup("Could not reach the Sheet. Check the Web app URL, and that it is deployed with access for Anyone.")}
}
function busyTyping(){const f=document.activeElement;return f&&(f.tagName==="INPUT"||f.tagName==="TEXTAREA")&&f.type!=="search"&&f.type!=="date"}

/* ---------- Render ---------- */
const main=document.getElementById("main");
function render(){
  if(!cfg)return showSetup();
  drawChrome();
  const keep=document.activeElement&&document.activeElement.id&&main.contains(document.activeElement)?document.activeElement.id:null;
  document.body.classList.toggle("tvcview",state.view==="tvc");
  ({calendar:renderCal,data:renderData,pending:renderPending,tvc:renderTvc,followups:renderFollowups})[state.view]();
  if(keep){const el=document.getElementById(keep);if(el)el.focus()}
  if(openId&&dlg.open)refreshDialog();
}
function drawChrome(){
  const st=document.getElementById("sheetTab");if(st)st.href=(cfg&&cfg.sheet)||DEFAULT_SHEET;
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.v===state.view));
  document.querySelectorAll("#pcTabs button").forEach(b=>{b.setAttribute("aria-selected",b.dataset.f===state.pcf);document.getElementById("pcn-"+b.dataset.f).textContent=state.acts.filter(a=>!isArchived(a)&&matchPoc(a)&&matchWeek(a)&&matchPcf(a,b.dataset.f)).length});
  drawPocFilter();drawWeekFilter();
  const n=visible().filter(a=>a.date&&!isClosed(a)).reduce((s,a)=>s+applicable(a).filter(it=>isOpen(a,it)).length+FORMATS.filter(f=>hasFmt(a,f)&&!fmtDone(a,f)).length,0);const pc=document.getElementById("pendCount");pc.hidden=!n;pc.textContent=n;
}
function marksHTML(a){return `<span class="marks">${CHIP_MARKS.map(k=>{const it=ITEMS.find(i=>i.k===k);return `<span class="mk ${stateOf(a,it)}" title="${esc(it.label)}: ${esc(OPT_LABEL[v(a,it)]||v(a,it))}">${it.short}</span>`}).join("")}</span>`}
function isDoneSt(a){return /^done$/i.test(a.status||"")}
function toggleDone(id){const a=state.acts.find(x=>x.id===id);if(!a)return;const old=a.status||"",on=!isDoneSt(a);patch(id,{status:on?"Done":"Pending"});toast(on?"Marked done":"Reopened",()=>patch(id,{status:old}))}
function doneBox(a){const on=isDoneSt(a);return `<span class="dn${on?" on":""}" title="${on?"Reopen":"Mark as done"}">✓</span>`}
function wireDone(c,a){const d=c.querySelector(".dn");d.onpointerdown=e=>e.stopPropagation();d.ondblclick=e=>e.stopPropagation();d.onclick=e=>{e.preventDefault();e.stopPropagation();toggleDone(a.id)}}
/* A target week runs Monday to Sunday, and the 1st week of a month is the first such week with at least four days in that month. */
function weekSunday(w){const m=String(w||"").match(/(\d)\w*\s+week\s+(\w{3})/i);if(!m)return"";const mo=MON[m[2].toLowerCase()];if(!mo)return"";
  const now=parse(TODAY),cy=now.getFullYear(),cur=now.getMonth()+1,y=mo<7&&cur>=7?cy+1:mo>=7&&cur<7?cy-1:cy;
  const d=new Date(y,mo-1,4);d.setDate(4+(7-d.getDay())%7+(Number(m[1])-1)*7);return iso(d)}
/* Whether the activity is confirmed or tentative. Kept in the Sheet's old Time column (field "time"). */
const CONF=["Confirmed","Tentative"];
function confOf(a){const x=String(a.time||"").trim();return /^confirmed$/i.test(x)?"Confirmed":/^tentative$/i.test(x)?"Tentative":""}
function confTag(a){const c=confOf(a);return c?` <span class="tag cf ${c==="Tentative"?"tent":"conf"}">${c}</span>`:""}
function confCls(a){const c=confOf(a);return c==="Tentative"?" tent":c==="Confirmed"?" conf":""}
function typeTag(a){if(isCmPc(a))return `<span class="tag cmpc">CM PC</span>`+confTag(a);return `<span class="tag ${a.type==="Event"?"ev":"pc"}">${a.type==="Event"?"Event":"PC"}</span>`+confTag(a)}

/* ---------- To schedule (activities without a date) ---------- */
const bl={q:"",sector:"",closed:false};
const MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
function weekKey(w){const m=String(w||"").match(/(\d)\w*\s+week\s+(\w{3})/i);if(m){let mo=MON[m[2].toLowerCase()]||0;if(mo<7)mo+=12;return mo*10+Number(m[1])}
  if(/anytime/i.test(w))return 900;if(/inaugurated/i.test(w))return 990;return 950}
const FMT_SHORT={"PC":"PC","Minister site visit":"Site visit","Event with Minister":"Event","Op-ed":"Op-ed","Print ad":"Ad","Beneficiary interaction":"Beneficiaries","CM event":"CM event","CM PC":"CM PC","Minister PC":"Min PC","Minister event":"Min event","Editorial":"Editorial","SMS campaign":"SMS","Vox Pop":"Vox pop","Beneficiary bytes":"Bytes","Influencer campaign":"Influencers"};
/* Sub-parts of an activity (the Yes/No columns of the Media Calendar), stored as a comma list in "formats" */
/* The list is shared by everyone: it is kept in a settings row (Type "Config") in the Activities sheet and can be edited from the dashboard. */
const DEFAULT_FORMATS=["CM event","CM PC","Minister PC","Minister event","Print ad","PR","Editorial","IVRS","WhatsApp","SMS campaign","Vox Pop","Beneficiary bytes","Influencer campaign"];
let FORMATS=DEFAULT_FORMATS.slice();
const CONFIG_ID="cfg-options";
function readConfig(row){try{const j=JSON.parse(String(row&&row.context||"{}").replace(/^'/,""));if(Array.isArray(j.formats)&&j.formats.length)return j.formats.map(s=>String(s).trim()).filter(Boolean)}catch(e){}return DEFAULT_FORMATS.slice()}
function saveFormats(list){FORMATS=[...new Set(list.map(s=>String(s).replace(/,/g," ").trim()).filter(Boolean))];
  const row={id:CONFIG_ID,type:"Config",title:"Dashboard settings - requirement options (do not delete)",context:JSON.stringify({formats:FORMATS}),status:"",updatedAt:new Date().toISOString()};
  state.config=row;queue({op:"save",row:clean(row)});render()}
function addFormatOption(){const n=(prompt("New requirement option (shared with everyone):")||"").replace(/,/g," ").trim();if(!n)return"";
  const ex=FORMATS.find(f=>f.toLowerCase()===n.toLowerCase());if(ex)return ex;saveFormats([...FORMATS,n]);toast(`Added “${n}” to the requirement options`);return n}
function fmtRaw(a){return (a.formats||"").split(",").map(s=>s.trim()).filter(Boolean)}
function fmtName(x){return x.replace(/\s*\(done\)$/i,"").replace(/\s*@\s*\d{4}-\d{2}-\d{2}$/,"")}
function rawDate(x){const m=String(x||"").match(/@\s*(\d{4}-\d{2}-\d{2})/);return m?m[1]:""}
function fmtCompose(f,d,done){return f+(d?" @"+d:"")+(done?" (done)":"")}
function fmtDate(a,f){return rawDate(fmtRaw(a).find(x=>fmtName(x)===f))}
function setFmtDate(a,f,d){return {formats:fmtRaw(a).map(x=>fmtName(x)===f?fmtCompose(f,d,/\(done\)$/i.test(x)):x).join(", ")}}
function fmtList(a){return fmtRaw(a).map(fmtName)}
function fmtDone(a,f){return fmtRaw(a).some(x=>fmtName(x)===f&&/\(done\)$/i.test(x))}
function setFmtDone(a,f,on){return {formats:fmtRaw(a).map(x=>fmtName(x)===f?fmtCompose(f,rawDate(x),on):x).join(", ")}}
function hasFmt(a,f){return fmtList(a).includes(f)}
/* A PC is an entry of type PC, or any entry with the PC sub-part ticked. It is a CM PC when also marked CM level or To be done by CM. */
function isPcEntry(a){return a.type==="PC"||hasFmt(a,"PC")||hasFmt(a,"Minister PC")||hasFmt(a,"CM PC")}
function isCmPc(a){return isPcEntry(a)&&(hasFmt(a,"CM level")||hasFmt(a,"CM PC")||a.status==="To be done by CM")}
/* Switching between PC, CM PC and Event. CM PC is stored as the "CM level" value in formats, so existing Sheet rows keep working. */
function typeOf(a){return isCmPc(a)?"CM PC":a.type}
function typePatch(a,t){const rest=fmtRaw(a).filter(x=>fmtName(x)!=="CM level");
  if(t==="CM PC"){const p={formats:["CM level",...rest].join(", ")};if(!isCmPc(a))p.type="PC";return p}
  const p={type:t,formats:rest.join(", ")};if(a.status==="To be done by CM")p.status="Pending";return p}
function matchPcf(a,f){return f==="all"||(f==="cm"?isCmPc(a):isPcEntry(a)&&!isCmPc(a))}
function pocList(a){return (a.poc||"").split(/[,&\/]+|\s+and\s+/i).map(s=>s.trim()).filter(Boolean)}
function matchPoc(a){return !state.poc||pocList(a).some(x=>x.toLowerCase()===state.poc.toLowerCase())}
function wkKey(a){return String(a.week||"").trim().toLowerCase()}
function matchWeek(a){return !state.weeks.length||state.weeks.includes(wkKey(a))}
function visible(withArchived){return state.acts.filter(a=>(withArchived||!isArchived(a))&&matchPoc(a)&&matchWeek(a)&&matchPcf(a,state.pcf))}
/* Every .wkf picker (top bar and Data view) shows the same ticked target weeks. */
function weekOrder(k){if(!k)return"99999";const s=weekSunday(k);if(s)return s;return (/^anytime/.test(k)?"99998-":"99990-")+k}
function drawWeekFilter(){const seen=new Map();

  state.weeks.forEach(k=>{if(!seen.has(k))seen.set(k,k||"No target week")});

      m.querySelectorAll("[data-wk]").forEach(c=>c.onchange=()=>{const k=c.dataset.wk;state.weeks=c.checked?[...state.weeks.filter(x=>x!==k),k]:state.weeks.filter(x=>x!==k);render()});

document.addEventListener("click",e=>{document.querySelectorAll(".wkf[open]").forEach(d=>{if(!d.contains(e.target))d.open=false})});
function drawPocFilter(){const s=document.getElementById("pocF"),seen=new Map();state.acts.forEach(a=>pocList(a).forEach(x=>{if(!seen.has(x.toLowerCase()))seen.set(x.toLowerCase(),x)}));
  if(state.poc&&!seen.has(state.poc.toLowerCase()))seen.set(state.poc.toLowerCase(),state.poc);
  const names=[...seen.values()].sort((p,q)=>p.localeCompare(q)),key=names.join("|");if(s.dataset.key!==key){s.dataset.key=key;s.innerHTML=`<option value="">All POCs</option>`+names.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join("")}s.value=state.poc}
function toggleFmt(a,f,on){const raw=fmtRaw(a),had=raw.find(x=>fmtName(x)===f),cur=raw.filter(x=>fmtName(x)!==f);if(on)cur.push(had||f);
  const p={formats:FORMATS.flatMap(F=>cur.filter(x=>fmtName(x)===F)).concat(cur.filter(x=>!FORMATS.includes(fmtName(x)))).join(", ")};
  if(f==="Print ad"){if(on&&(!a.printAd||a.printAd==="None"))p.printAd="Size TBD";if(!on)p.printAd="None"}
  return p}
function fmtChips(a){return fmtList(a).filter(f=>f!=="CM level").map(f=>`<span class="fchip">${esc(FMT_SHORT[f]||f)}</span>`).join("")}
function backlogPanel(){
  const all=visible().filter(a=>!a.date);

  const q=bl.q.trim().toLowerCase();if(q)list=list.filter(a=>[a.title,a.context,a.sector,a.poc,a.timing].join(" ").toLowerCase().includes(q));
  list.sort((p,q2)=>weekKey(p.week)-weekKey(q2.week)||(p.sector||"").localeCompare(q2.sector||""));
  const p=document.createElement("aside");p.className="backlog";p.dataset.date="";
  p.innerHTML=`<header><h3>To schedule</h3><span class="pill">${list.length}</span></header>
   <div class="blf"><input type="search" id="blq" placeholder="Search" value="${esc(bl.q)}">
   <select id="bls"><option value="">All sectors</option>${sectors.map(s=>`<option ${s===bl.sector?"selected":""}>${esc(s)}</option>`).join("")}</select>
   <label class="small"><input type="checkbox" id="blc" ${bl.closed?"checked":""}> Show done</label></div>`;
  const box=document.createElement("div");box.className="blist";let wk=null;
  list.forEach(a=>{const w=a.week||"No target week";if(w!==wk){wk=w;box.insertAdjacentHTML("beforeend",`<div class="blwk">${esc(w)}</div>`)}
    const c=document.createElement("button");c.type="button";c.className="chip bl"+(a.type==="Event"?" ev":"")+(isCmPc(a)?" cmpc":"")+confCls(a)+(isClosed(a)?" closed inactive":"");c.dataset.id=a.id;
    c.innerHTML=`<span class="ct">${esc(a.title||"Untitled")}</span><span class="cm">${typeTag(a)} ${esc([a.sector,a.poc].filter(Boolean).join(" · "))}</span>${a.timing?`<span class="cm">${esc(a.timing.split("\n")[0])}</span>`:""}<span class="fchips">${fmtChips(a)}</span>${doneBox(a)}`;
    c.ondblclick=e=>{e.stopPropagation();openEdit(a.id)};c.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();openEdit(a.id)}};
    wireDone(c,a);attachDrag(c,a.id);box.append(c)});
  if(!list.length)box.innerHTML=`<div class="empty small">Nothing here. Everything matching is on the calendar.</div>`;
  p.append(box);return p;

function wireBacklog(){
  const q=document.getElementById("blq");q.oninput=()=>{bl.q=q.value;clearTimeout(q._t);q._t=setTimeout(()=>{const pos=q.selectionStart;render();const n=document.getElementById("blq");n.focus();n.setSelectionRange(pos,pos)},250)};
  document.getElementById("bls").onchange=e=>{bl.sector=e.target.value;render()};
  document.getElementById("blc").onchange=e=>{bl.closed=e.target.checked;render()};

/* ---------- Drag to move (mouse, pen and touch) ---------- */
const touchOnly=matchMedia("(hover:none)").matches;
let drag=null,suppressClick=false;
function attachDrag(el,id){
  el.addEventListener("pointerdown",e=>{if(e.button>0)return;
    const st={id,el,x:e.clientX,y:e.clientY,pid:e.pointerId,active:false,touch:e.pointerType==="touch",timer:null};
    if(st.touch)st.timer=setTimeout(()=>begin(st,st.x,st.y),380);drag=st});
  el.addEventListener("click",e=>{if(suppressClick){suppressClick=false;e.preventDefault();return}if(touchOnly)openEdit(id)});
}
let lastY=0,scrollTimer=null;
function autoScroll(){if(!drag||!drag.active){clearInterval(scrollTimer);scrollTimer=null;return}
  const h=innerHeight,edge=70;let dy=0;if(lastY>h-edge)dy=Math.ceil((lastY-(h-edge))/3);else if(lastY<edge)dy=-Math.ceil((edge-lastY)/3);
  if(dy){scrollBy(0,dy);place(drag,drag.lx,lastY)}}
function begin(st,x,y){st.active=true;st.lx=x;lastY=y;if(!scrollTimer)scrollTimer=setInterval(autoScroll,30);st.el.classList.add("dragging");const g=st.el.cloneNode(true);g.classList.add("ghost-chip");g.classList.remove("dragging");document.body.append(g);st.ghost=g;place(st,x,y);
  try{st.el.setPointerCapture(st.pid)}catch(_){}if(navigator.vibrate)try{navigator.vibrate(15)}catch(_){}}
function place(st,x,y){st.ghost.style.left=(x-60)+"px";st.ghost.style.top=(y-14)+"px";document.querySelectorAll(".day.drop").forEach(n=>n.classList.remove("drop"));
  const t=document.elementFromPoint(x,y);const day=t&&t.closest(".day,.backlog");if(day)day.classList.add("drop");st.over=day?day.dataset.date:null}
document.addEventListener("pointermove",e=>{if(!drag||e.pointerId!==drag.pid)return;const dx=Math.abs(e.clientX-drag.x),dy=Math.abs(e.clientY-drag.y);
  if(!drag.active){if(drag.touch){if(dx+dy>10){clearTimeout(drag.timer);drag=null}return}if(dx+dy>6)begin(drag,e.clientX,e.clientY);else return}
  e.preventDefault();drag.lx=e.clientX;lastY=e.clientY;place(drag,e.clientX,e.clientY)},{passive:false});
document.addEventListener("touchmove",e=>{if(drag&&drag.active)e.preventDefault()},{passive:false});
function endDrag(e){if(!drag||(e&&e.pointerId!==drag.pid))return;clearTimeout(drag.timer);const st=drag;drag=null;if(!st.active)return;
  suppressClick=true;setTimeout(()=>suppressClick=false,300);st.el.classList.remove("dragging");st.ghost&&st.ghost.remove();
  document.querySelectorAll(".day.drop").forEach(n=>n.classList.remove("drop"));
  const a=state.acts.find(x=>x.id===st.id);
  if(a&&st.over!=null&&st.over!==(a.date||"")){const old=a.date||"";patch(a.id,{date:st.over});
    toast(st.over?`${old?"Moved":"Scheduled"} “${a.title||"Untitled"}” on ${fmt(st.over,{weekday:"short",day:"numeric",month:"short"})}`:`Moved “${a.title||"Untitled"}” back to To schedule`,()=>patch(a.id,{date:old}))}}
document.addEventListener("pointerup",endDrag);document.addEventListener("pointercancel",endDrag);

/* ---------- Data table ---------- */
function stCls(a,it){return "s-"+stateOf(a,it)}
function sel(id,opts,cur,cls){return `<select id="${id}" class="${cls||""}">${opts.map(o=>`<option value="${esc(o)}" ${o===cur?"selected":""}>${esc(OPT_LABEL[o]||o)}</option>`).join("")}</select>`}
/* Requirements: activity formats (ticks kept in Suggested formats) plus the tracked follow-ups (kept in their own columns). */
const REQ_IT={onePager:"One pager",adCoord:"Ad coordination",calendarPosted:"Calendar posted",live:"Live",bytes:"Bytes",pr:"PR",digital:"Digital report",social:"Social report"};
const fmtLabel=f=>f==="Event with Minister"?"Minister event":f;
/* A follow-up shows under Requirements only when its cell in the Sheet has been filled in. */
function itOn(a,it){const x=String(a[it.k]||"").trim();return !!x&&x!=="NA"&&x!=="Not needed"}
function itDone(a,it){return /^(done|received)$/i.test(v(a,it))}
function reqList(a){const L=[],open=!isClosed(a);
  const have=fmtList(a).filter(f=>f!=="CM level"),ord=f=>{const i=FORMATS.indexOf(f);return i<0?999:i};
  [...new Set(have)].sort((p,q)=>ord(p)-ord(q)).forEach(f=>{const d=fmtDone(a,f),due=fmtDate(a,f);L.push({key:"fmt:"+f,label:fmtLabel(f),done:d,due,fmt:true,late:open&&!d&&(due?due<TODAY:!!a.date&&a.date<TODAY)})});
  const labels=new Set(L.map(r=>r.label.toLowerCase()));
  applicable(a).forEach(it=>{if(itOn(a,it)&&!labels.has((REQ_IT[it.k]||it.label).toLowerCase()))L.push({key:"it:"+it.k,label:REQ_IT[it.k]||it.label,owner:it.owner,done:itDone(a,it),late:open&&stateOf(a,it)==="late"})});return L}
function reqAddable(a){return FORMATS.filter(f=>!hasFmt(a,f)).map(f=>["fmt:"+f,fmtLabel(f)])}
function reqHTML(a){const ad=reqAddable(a);

/* ---------- Follow-ups (requirements by their own dates) ---------- */

  vw.append(bar);
  const tomorrow=addDays(TODAY,1);let cur=null,box=null;
  items.forEach(i=>{if(i.d!==cur){cur=i.d;const past=i.d<TODAY&&items.some(j=>j.d===i.d&&!j.done);
      const lab=i.d===TODAY?"Today":i.d===tomorrow?"Tomorrow":fmt(i.d,{weekday:"short",day:"numeric",month:"short"});
      box=document.createElement("section");box.className="fuday"+(past?" past":"")+(i.d===TODAY?" today":"");
      box.innerHTML=`<header><h3>${past?"Overdue · ":""}${esc(lab)}</h3>${i.d===TODAY||i.d===tomorrow?`<small>${fmt(i.d,{weekday:"short",day:"numeric",month:"short"})}</small>`:""}</header>`;vw.append(box)}
    const r=document.createElement("div");r.className="furow"+(i.done?" done":"")+(!i.done&&i.d<TODAY?" late":"");
    r.innerHTML=`<label class="fuck" title="${i.done?"Done":"Mark done"}"><input type="checkbox" ${i.done?"checked":""}><span>${esc(fmtLabel(i.f))}</span></label>
      <div class="pt"><b>${esc(i.a.title||"Untitled")}</b><small>${typeTag(i.a)} ${esc([i.a.sector,i.a.poc].filter(Boolean).join(" · "))}${i.a.date?" · Activity "+fmt(i.a.date,{day:"numeric",month:"short"}):i.a.week?" · "+esc(i.a.week):""}</small></div>
      <input type="date" value="${esc(i.d)}" aria-label="Date for ${esc(fmtLabel(i.f))}">`;
    r.querySelector(".fuck input").onchange=e=>{const on=e.target.checked;patch(i.a.id,setFmtDone(i.a,i.f,on));toast(`${fmtLabel(i.f)} ${on?"marked done":"reopened"}`,()=>{const x=state.acts.find(y=>y.id===i.a.id);if(x)patch(x.id,setFmtDone(x,i.f,!on))})};
    r.querySelector("input[type=date]").onchange=e=>patch(i.a.id,setFmtDate(i.a,i.f,e.target.value));
    r.querySelector(".pt").onclick=()=>openEdit(i.a.id);box.append(r)});
  if(!items.length)vw.insertAdjacentHTML("beforeend",`<div class="empty">No follow-ups with dates${state.fuDone?"":" still open"}. Add a date next to a requirement (PR, Print ad, Beneficiary bytes…) in the Data tab or in an entry, and it shows up here by date.</div>`);
  main.append(vw);
  document.getElementById("fuDone").onchange=e=>{state.fuDone=e.target.checked;render()};
}

/* ---------- Pending ---------- */
function renderPending(){
  main.innerHTML="";const vw=document.createElement("div");vw.className="view";
  vw.insertAdjacentHTML("beforeend",`<div class="small muted">Everything still to follow up, oldest first: unticked requirements such as PC or Print ad, then the tracked follow-ups. Mark items done here and it saves straight away. Click a heading to open the entry.</div>`);
  const g=document.createElement("div");g.className="pgrid";
  FORMATS.forEach(f=>{
    const list=visible().filter(a=>a.date&&!isClosed(a)&&hasFmt(a,f)&&!fmtDone(a,f)).sort((p,q)=>p.date.localeCompare(q.date));if(!list.length)return;
    const col=document.createElement("section");col.className="pcol";
    col.innerHTML=`<header><h3>${esc(fmtLabel(f))}</h3><span class="pill">${list.length}</span></header>`;
    list.forEach(a=>{const r=document.createElement("div");r.className="prow";const late=a.date<TODAY?daysBetween(a.date,TODAY):0;
      r.innerHTML=`<div class="pt"><b>${esc(a.title||"Untitled")}</b><small>${typeTag(a)} ${fmt(a.date,{day:"numeric",month:"short"})}${late?` · <span class="lateword">${late} day${late>1?"s":""} late</span>`:""}</small></div><button class="btn sm" type="button">Mark done</button>`;
      r.querySelector("button").onclick=()=>{patch(a.id,setFmtDone(a,f,true));toast(`${fmtLabel(f)} marked done`,()=>{const x=state.acts.find(y=>y.id===a.id);if(x)patch(a.id,setFmtDone(x,f,false))})};
      r.querySelector(".pt").onclick=()=>openEdit(a.id);col.append(r)});
    g.append(col)});
  ITEMS.forEach(it=>{
    const list=visible().filter(a=>a.date&&!isClosed(a)&&it.when(a)&&isOpen(a,it)).map(a=>({a,due:addDays(a.date,it.off)})).sort((p,q)=>p.due.localeCompare(q.due));
    const col=document.createElement("section");col.className="pcol";
    col.innerHTML=`<header><h3>${esc(it.label)}</h3><span class="pill ${list.length?"":"zero"}">${it.owner?esc(it.owner)+" · ":""}${list.length}</span></header>`;
    if(!list.length)col.insertAdjacentHTML("beforeend",`<div class="empty small">All clear.</div>`);
    list.forEach(({a,due})=>{const r=document.createElement("div");r.className="prow";const late=due<TODAY?daysBetween(due,TODAY):0;
      r.innerHTML=`<div class="pt"><b>${esc(a.title||"Untitled")}</b><small>${typeTag(a)} ${fmt(a.date,{day:"numeric",month:"short"})}${late?` · <span class="lateword">${late} day${late>1?"s":""} late</span>`:""}</small></div>${sel("p-"+it.k+"-"+a.id,it.opts,"Pending",late?"s-late":"s-open")}`;
      r.querySelector("select").onchange=e=>patch(a.id,{[it.k]:e.target.value});
      r.querySelector(".pt").onclick=()=>openEdit(a.id);col.append(r)});
    g.append(col)});
  vw.append(g);main.append(vw);
}

/* ---------- Entry dialog ---------- */
const dlg=document.getElementById("dlg"),body=document.getElementById("dlgBody");
let openId=null,isNew=false,draft=null;
function openNew(date){if(!cfg)return;draft=blank("PC",date);if(state.pcf==="cm")draft.formats="CM level";isNew=true;openId=null;drawDialog();dlg.showModal();setTimeout(()=>{const t=document.getElementById("fTitle");t&&t.focus()},30)}
function openEdit(id){if(!state.acts.find(x=>x.id===id))return;isNew=false;openId=id;draft=null;drawDialog();if(!dlg.open)dlg.showModal()}
function cur(){return isNew?draft:state.acts.find(x=>x.id===openId)}
function setField(k,val){if(isNew){draft[k]=val;if(k==="type"||k==="printAd"||ITEMS.some(i=>i.k===k))drawDialog();return}patch(openId,{[k]:val});drawDialog()}
function drawDialog(){
  const a=cur();if(!a){dlg.close();return}
  let phase="",items="";
  applicable(a).forEach(it=>{if(it.phase!==phase){phase=it.phase;items+=`<div class="phase">${phase}</div>`}
    const s=stateOf(a,it);
    items+=`<div class="srow"><div class="sl">${esc(it.label)}<small>${it.owner?esc(it.owner)+" · ":""}${it.off===0?"on the day":it.off<0?"before the day":"day after"}${s==="late"?' · <span class="lateword">overdue</span>':""}</small></div>${sel("s-"+it.k,it.opts,v(a,it),"s-"+s)}${it.link?`<div class="lk"><input type="text" id="l-${it.k}" placeholder="Paste report link or reference" value="${esc(a[it.link]||"")}"></div>`:""}</div>`});
  body.innerHTML=`<div class="dhd"><div class="typesw" role="group" aria-label="Type"><button type="button" data-t="PC" aria-pressed="${typeOf(a)==="PC"}">PC</button><button type="button" data-t="CM PC" aria-pressed="${typeOf(a)==="CM PC"}">CM PC</button><button type="button" data-t="Event" aria-pressed="${typeOf(a)==="Event"}">Event</button></div><div style="display:flex;gap:8px">${isNew?"":`<button class="btn sm ${isDoneSt(a)?"":"doneb"}" type="button" id="dDone">${isDoneSt(a)?"Reopen":"Mark as Done"}</button>`}<button class="btn sm" type="button" id="dClose">Close</button></div></div>
  <div class="form">
    <label class="full">Heading<input type="text" class="title-in" id="fTitle" value="${esc(a.title)}" placeholder="${a.type==="PC"?"What is the PC about":"Event name"}"></label>
    <label title="Leave empty to keep it in the To schedule list">Date (optional)<input type="date" id="fDate" value="${a.date||""}"></label>
    <label>Confirmed / Tentative<select id="fTime">${["",...CONF].map(o=>`<option value="${o}" ${o===confOf(a)?"selected":""}>${o||"Not set"}</option>`).join("")}</select></label>
    <label>Minister / Department<input type="text" id="fMin" value="${esc(a.minister)}"></label>
    <label>Venue<input type="text" id="fVenue" value="${esc(a.venue)}"></label>
    <label>District<input type="text" id="fDist" value="${esc(a.district)}"></label>
    <label>Print ad<select id="fAd">${ADS.map(o=>`<option ${o===(a.printAd||"None")?"selected":""}>${o}</option>`).join("")}</select></label>
    <label class="full">${a.type==="Event"?"When, where, context":"Context"}<textarea id="fCtx">${esc(a.context)}</textarea></label>
    <label>Sector<input type="text" id="fSec" value="${esc(a.sector)}"></label>
    <label>POC<input type="text" id="fPoc" value="${esc(a.poc)}"></label>
    <label>Overall status<select id="fSt">${(OVERALL.includes(a.status)||!a.status?["",...OVERALL]:["",a.status,...OVERALL]).map(o=>`<option value="${esc(o)}" ${o===(a.status||"")?"selected":""}>${esc(o||"Not set")}</option>`).join("")}</select></label>
    <label>Target week<input type="text" id="fWk" value="${esc(a.week)}" placeholder="e.g. 2nd week Nov"></label>
    <label class="full">Timing note<textarea id="fTim" style="min-height:40px">${esc(a.timing)}</textarea></label>
  </div>
  <div class="subparts"><div class="phase">What this activity needs</div>
    <div class="sp" role="group" aria-label="What this activity needs">${FORMATS.map((f,i)=>`<button type="button" class="spb" id="sp-${i}" data-f="${esc(f)}" aria-pressed="${hasFmt(a,f)}"><span class="tick" aria-hidden="true"></span>${esc(f)}</button>`).join("")}</div>
    <div class="small muted">Tap to switch each one on or off. Print ad also sets the Print ad field above. <button class="x" type="button" id="dOpts">Edit option list</button></div>
    ${fmtList(a).filter(f=>f!=="CM level").length?`<div class="rqdates">${[...new Set(fmtList(a).filter(f=>f!=="CM level"))].map((f,i)=>`<label>${esc(fmtLabel(f))}<input type="date" id="rqd-${i}" data-f="${esc(f)}" value="${esc(fmtDate(a,f))}"></label>`).join("")}</div><div class="small muted">Dates for each requirement show in the Follow-ups tab.</div>`:""}</div>
  <div>${items}</div>
  <div class="subparts"><div class="phase">Next steps</div><div id="dSteps">${stepsHTML(a,"d-")}</div></div>
  <div class="form"><label class="full">Remarks<textarea id="fRem">${esc(splitRem(a.remarks).rem)}</textarea></label></div>
  <div class="foot">${isNew?`<span class="small muted">You can change everything later.</span><button class="btn primary" type="button" id="dSave">Add to calendar</button>`:`<button class="btn sm" type="button" id="dDel">Delete</button><span class="small muted">Changes save as you go.</span>`}</div><div id="cf"></div>`;
  body.querySelector("#dClose").onclick=()=>dlg.close();
  const dDone=body.querySelector("#dDone");if(dDone)dDone.onclick=()=>toggleDone(openId);
  body.querySelector("#dOpts").onclick=()=>openOptions();
  body.querySelectorAll(".rqdates input").forEach(el=>el.onchange=()=>{const p=setFmtDate(cur(),el.dataset.f,el.value);if(isNew)Object.assign(draft,p);else patch(openId,p);drawDialog()});
  body.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{const p=typePatch(cur(),b.dataset.t);if(isNew)Object.assign(draft,p);else patch(openId,p);drawDialog()});
  const map={fTitle:"title",fDate:"date",fTime:"time",fMin:"minister",fVenue:"venue",fDist:"district",fAd:"printAd",fCtx:"context",fRem:"remarks",fSec:"sector",fPoc:"poc",fSt:"status",fWk:"week",fTim:"timing"};
  const remJoin=(k,val)=>k==="remarks"?joinRem(val,splitRem(cur().remarks).steps):val;
  Object.entries(map).forEach(([id,k])=>{const el=body.querySelector("#"+id);el.addEventListener("change",()=>setField(k,remJoin(k,el.value.trim())))});
  wireSteps(body.querySelector("#dSteps"),cur,q=>{if(isNew)Object.assign(draft,q);else patch(openId,q);drawDialog()});
  body.querySelectorAll(".spb").forEach(b=>b.onclick=()=>{const on=b.getAttribute("aria-pressed")!=="true";const p=toggleFmt(cur(),b.dataset.f,on);
    if(isNew){Object.assign(draft,p);drawDialog()}else{patch(openId,p);drawDialog()}const n=document.getElementById(b.id);n&&n.focus()});
  body.querySelector("#fAd").addEventListener("change",e=>{const a2=cur();const want=e.target.value!=="None";if(want!==hasFmt(a2,"Print ad")){const p=toggleFmt(a2,"Print ad",want);delete p.printAd;if(isNew)Object.assign(draft,p);else patch(openId,p);drawDialog()}});
  applicable(a).forEach(it=>{body.querySelector("#s-"+it.k).onchange=e=>setField(it.k,e.target.value);if(it.link)body.querySelector("#l-"+it.k).onchange=e=>setField(it.link,e.target.value.trim())});
  if(isNew)body.querySelector("#dSave").onclick=()=>{Object.entries(map).forEach(([id,k])=>draft[k]=remJoin(k,body.querySelector("#"+id).value.trim()));
    if(!draft.title){const t=body.querySelector("#fTitle");t.focus();t.placeholder="Add a heading first";return}
    const d=draft.date;save(draft);isNew=false;draft=null;dlg.close();toast(d?"Added to "+fmt(d,{day:"numeric",month:"short"}):"Added to To schedule");if(d)state.month=d.slice(0,7);render()};
  else body.querySelector("#dDel").onclick=()=>{const cf=body.querySelector("#cf");cf.innerHTML=`<div class="confirm"><span>Delete “${esc(a.title||"Untitled")}”?</span><button class="btn sm danger" type="button" id="dYes">Delete</button><button class="btn sm" type="button" id="dNo">Keep</button></div>`;
    cf.querySelector("#dYes").onclick=()=>{const copy=structuredClone(a);dlg.close();remove(a.id);toast("Deleted",()=>save(copy))};cf.querySelector("#dNo").onclick=()=>cf.innerHTML=""};
}
function refreshDialog(){const a=cur();if(!a||isNew)return;const f=document.activeElement;if(f&&body.contains(f)&&(f.tagName==="INPUT"||f.tagName==="TEXTAREA"))return;const fid=f&&f.id;drawDialog();if(fid){const n=document.getElementById(fid);n&&n.focus()}}
dlg.addEventListener("close",()=>{openId=null;isNew=false;draft=null});
document.getElementById("btnNew").onclick=()=>openNew(state.month===TODAY.slice(0,7)?TODAY:state.month+"-01");

/* ---------- Setup screen ---------- */
function showSetup(msg){
  main.innerHTML=`<div class="setup"><h2>Enter the desk key</h2>
  <p class="muted" style="margin:0">This calendar is for the Punjab Media Desk team. Enter the desk key you were given, or open the team link someone sent you and this step is skipped.</p>
  <label>Desk key<input type="text" id="cKey" value="${esc(cfg&&cfg.k||"")}" autocomplete="off"></label>
  <details><summary class="small muted" style="cursor:pointer">Advanced</summary>
  <div style="display:grid;gap:10px;margin-top:8px">
  <label>Web app URL<input type="url" id="cApi" value="${esc(cfg&&cfg.api||DEFAULT_API)}"></label>
  <label>Google Sheet link<input type="url" id="cSheet" value="${esc(cfg&&cfg.sheet||DEFAULT_SHEET)}"></label></div></details>
  ${msg?`<div class="err">${esc(msg)}</div>`:""}
  <div><button class="btn primary" id="cGo" type="button">Open calendar</button></div></div>`;
  document.getElementById("cKey").onkeydown=e=>{if(e.key==="Enter")document.getElementById("cGo").click()};
  document.getElementById("cGo").onclick=()=>{const api=document.getElementById("cApi").value.trim(),k=document.getElementById("cKey").value.trim(),sheet=document.getElementById("cSheet").value.trim();
    if(!/^https:\/\/script\.google\.com\//.test(api)||!k){showSetup("Enter the desk key.");return}
    cfg={api,k,sheet};storeCfg(cfg);loaded=false;setConn("Connecting…");refresh()};
}

/* ---------- Share and export ---------- */
document.getElementById("btnShare").onclick=async()=>{if(!cfg){toast("Connect to the Sheet first.");return}const link=OPEN_CFG?location.origin+location.pathname:teamLink();
  try{await navigator.clipboard.writeText(link);toast("Team link copied. Anyone with it can view and edit.")}catch(e){prompt("Copy this team link:",link)}};
function exportExcel(){
  if(typeof XLSX==="undefined"){toast("The Excel library did not load. Reload the page and try again.");return}
  const rows=state.acts.slice().sort((p,q)=>(p.date+(p.time||"")).localeCompare(q.date+(q.time||""))).map(a=>{const r={"Date":a.date||"To schedule","Day":a.date?parse(a.date).toLocaleDateString("en-IN",{weekday:"short"}):"","Confirmed / Tentative":confOf(a),"Type":a.type,"Heading":a.title,"Sector":a.sector||"","POC":a.poc||"","Overall status":a.status||"","Target week":a.week||"","Timing note":a.timing||"","Suggested formats":a.formats||"","Minister / Department":a.minister||"","Venue":a.venue||"","District":a.district||"","Context":a.context||"","Print ad":a.printAd||"None"};
    ITEMS.forEach(it=>{r[it.label+(it.owner?" ("+it.owner+")":"")]=it.when(a)?(OPT_LABEL[v(a,it)]||v(a,it)):"n/a";if(it.link)r[it.label+" link"]=a[it.link]||""});const sr=splitRem(a.remarks);r["Next steps"]=sr.steps.map(s=>(s.done?"[done] ":"[ ] ")+s.text).join("\n");r["Remarks"]=sr.rem;return r});
  const wb=XLSX.utils.book_new();const ws=rows.length?XLSX.utils.json_to_sheet(rows):XLSX.utils.aoa_to_sheet([["No entries yet"]]);
  const rg=ws["!ref"]&&XLSX.utils.decode_range(ws["!ref"]);if(rg)ws["!cols"]=Array.from({length:rg.e.c+1},()=>({wch:20}));
  XLSX.utils.book_append_sheet(wb,ws,"Media Desk");XLSX.writeFile(wb,"Punjab_Media_Desk_"+TODAY+".xlsx");
}
document.getElementById("btnExport").onclick=exportExcel;

/* ---------- Start ---------- */
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{state.view=b.dataset.v;render()});
document.querySelectorAll("#pcTabs button").forEach(b=>b.onclick=()=>{state.pcf=b.dataset.f;render()});
document.getElementById("pocF").onchange=e=>{state.poc=e.target.value;render()};
if(cfg){main.innerHTML=`<div class="empty">Loading the calendar from the Google Sheet…</div>`;refresh()}else{setConn("Not connected","bad");showSetup()}
setInterval(()=>{if(document.visibilityState==="visible")refresh()},15000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")refresh()});
</script>
</body>
</html>
