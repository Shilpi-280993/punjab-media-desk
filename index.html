<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Punjab Media Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: header bar, segmented tabs, then Calendar / Data / Pending. PCs are blue, CM PCs are purple, events are teal; green done, amber pending, red overdue. */
:root{
  --bg:#f4f6f9; --surface:#ffffff; --fg:#1d2733; --muted:#5f6b7a; --line:#dde3ea; --soft:#eef1f5;
  --brand:#1f3a5f; --brand-fg:#ffffff;
  --pc:#2f5bd3; --pc-bg:#e9efff; --ev:#0f8a7e; --ev-bg:#e3f5f2; --cm:#7a2fc2; --cm-bg:#f2e8fd; --cm-fg:#ffffff;
  --ok:#1e7f43; --ok-bg:#dff3e6; --wait:#a15c00; --wait-bg:#fff1d6; --late:#c0352b; --late-bg:#fde4e1; --na:#8a94a3; --na-bg:#eef0f3;
  --sans:"Source Sans 3","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  --r:8px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#12171e; --surface:#1a212b; --fg:#e6ebf1; --muted:#9aa6b4; --line:#2e3946; --soft:#222b36;
  --brand:#24456f; --brand-fg:#ffffff;
  --pc:#8fb0ff; --pc-bg:#1e2a4a; --ev:#5fd0c3; --ev-bg:#16332f; --cm:#c9a2ff; --cm-bg:#2f2145; --cm-fg:#241433;
  --ok:#6fd497; --ok-bg:#173524; --wait:#f2b55a; --wait-bg:#3a2a10; --late:#ff8a80; --late-bg:#3f1d1a; --na:#8792a0; --na-bg:#252d37; color-scheme:dark}}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.45;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3{margin:0;font-weight:700;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pc);outline-offset:2px}
[hidden]{display:none!important}
.muted{color:var(--muted)} .small{font-size:.86rem} .num{font-variant-numeric:tabular-nums}

.topbar{background:var(--brand);color:var(--brand-fg)}
.topbar .in{max-width:1260px;margin:0 auto;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between}
.topbar h1{font-size:1.45rem;letter-spacing:.01em}
.topbar .sub{font-size:.88rem;opacity:.8}
.topbar .actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 14px;border-radius:var(--r);font-weight:600}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--pc);border-color:var(--pc);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.topbar .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.35);color:#fff}
.topbar .btn.primary{background:#fff;color:var(--brand);border-color:#fff}
.btn.sm{padding:4px 10px;font-size:.88rem}
.btn:disabled{opacity:.45;cursor:not-allowed}

.wrap{max-width:1260px;margin:0 auto;padding-block:16px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.navrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.tabs{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.tabs button{border:none;background:none;padding:6px 16px;border-radius:999px;color:var(--muted);font-weight:600}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tabs .count{display:inline-block;min-width:20px;padding:0 6px;margin-left:4px;border-radius:999px;background:var(--wait-bg);color:var(--wait);font-size:.75rem}
.navl{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tabs .pcn{margin-left:5px;font-size:.78rem;opacity:.75;font-variant-numeric:tabular-nums}
#pcTabs button[data-f="cm"][aria-selected="true"]{background:var(--cm);color:var(--cm-fg)}
.conn{font-size:.85rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.conn i{width:8px;height:8px;border-radius:50%;background:var(--na);display:inline-block}
.conn.ok i{background:var(--ok)} .conn.bad i{background:var(--late)}

.view{display:grid;gap:14px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.bar .left{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input[type=date],input[type=time],input[type=text],input[type=search],input[type=url],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 8px;min-width:0}
textarea{width:100%;min-height:60px}
.empty{color:var(--muted);padding:6px 0}
.brief{border:1px solid var(--line);border-left:4px solid var(--pc);background:var(--surface);border-radius:var(--r);padding:10px 14px;white-space:pre-wrap;font-size:.94rem}
.brief summary{cursor:pointer;font-weight:700}

/* tags and status pills */
.tag{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:0 6px;border-radius:4px;vertical-align:1px}
.tag.pc{background:var(--pc-bg);color:var(--pc)} .tag.ev{background:var(--ev-bg);color:var(--ev)} .tag.cmpc{background:var(--cm);color:var(--cm-fg)}
.marks{display:inline-flex;gap:3px;flex-wrap:wrap}
.mk{display:inline-block;font-size:.66rem;font-weight:700;min-width:22px;text-align:center;border-radius:4px;padding:0 3px;line-height:1.45}
.mk.done{background:var(--ok-bg);color:var(--ok)}
.mk.open{background:var(--wait-bg);color:var(--wait)}
.mk.late{background:var(--late-bg);color:var(--late)}
.mk.na{background:var(--na-bg);color:var(--na);text-decoration:line-through}
.legend{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:.82rem;color:var(--muted)}
.legend span{display:inline-flex;gap:4px;align-items:center}
.sw{width:11px;height:11px;border-radius:3px;display:inline-block}
.sw.done{background:var(--ok)} .sw.open{background:var(--wait)} .sw.late{background:var(--late)} .sw.na{background:var(--na)}
.sw.wk{border:1px dashed var(--muted)}

/* calendar */
.calnav h2{min-width:180px;text-align:center;font-size:1.25rem}
.calwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));min-width:680px;user-select:none;-webkit-user-select:none}
.cal .dow{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:8px;border-bottom:1px solid var(--line);font-weight:700;background:var(--soft)}
.cal .day{min-height:124px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:5px}
.cal .day:nth-child(7n+7){border-right:none}
.cal .day.out{background:var(--bg)} .cal .day.out .d{color:var(--na)}
.cal .day.wkend:not(.out){background:color-mix(in srgb,var(--soft) 45%,var(--surface))}
.cal .day.today{box-shadow:inset 0 0 0 2px var(--pc)}
.cal .day.today .d{background:var(--pc);color:#fff;border-radius:999px;padding:0 7px}
.cal .day.drop{background:var(--pc-bg);box-shadow:inset 0 0 0 2px var(--pc)}
.cal .dh{display:flex;justify-content:space-between;align-items:center}
.cal .d{font-size:.88rem;font-weight:700;font-variant-numeric:tabular-nums}
.cal .add{background:none;border:1px solid var(--line);border-radius:4px;color:var(--muted);font-size:.9rem;line-height:1;padding:2px 7px;opacity:0}
.cal .day:hover .add,.cal .add:focus-visible{opacity:1}
@media (hover:none){.cal .add{opacity:1}}
.chip{position:relative;display:grid;gap:3px;border:1px solid transparent;border-left:4px solid var(--pc);border-radius:6px;padding:4px 6px;background:var(--pc-bg);font-size:.8rem;line-height:1.25;cursor:grab;text-align:left;width:100%;touch-action:manipulation;color:var(--fg)}
.chip.ev{border-left-color:var(--ev);background:var(--ev-bg)}
.chip.cmpc{border-left-color:var(--cm);background:var(--cm-bg)}
.chip.late{border-color:var(--late);border-left-color:var(--late)}
.chip:hover{filter:brightness(.98);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.chip .ct{padding-right:20px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .cm{color:var(--muted);font-size:.74rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .dn{position:absolute;top:3px;right:3px;width:16px;height:16px;border:1.5px solid var(--na);border-radius:4px;display:grid;place-items:center;font-size:.68rem;line-height:1;color:transparent;background:var(--surface);cursor:pointer}
.chip .dn:hover{border-color:var(--ok);color:var(--ok)}
.chip .dn.on{background:var(--ok);border-color:var(--ok);color:#fff}
.chip.wk{border:1px dashed var(--line);border-left:4px solid var(--pc);padding:2px 5px}
.chip.wk.ev{border-left-color:var(--ev)}
.chip.wk.cmpc{border-left-color:var(--cm)}
.chip.inactive,.chip.bl.inactive,.chip.wk.inactive{background:var(--soft);border-left-color:var(--na);opacity:.6;filter:grayscale(1)}
.chip.inactive .ct{text-decoration:line-through}
.wkh{font-size:.68rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.wkbox{display:grid;gap:3px;max-height:190px;overflow-y:auto;align-content:start}
.chip.dragging{opacity:.35}
.ghost-chip{position:fixed;pointer-events:none;z-index:50;box-shadow:0 8px 22px rgba(0,0,0,.25);width:170px;cursor:grabbing}

/* calendar + to-schedule list */
.calgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
@media (max-width:1100px){.calgrid{grid-template-columns:minmax(0,1fr)}}
.backlog{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:10px;display:grid;gap:8px;position:sticky;top:10px;max-height:calc(100vh - 30px);grid-template-rows:auto auto minmax(0,1fr)}
@media (max-width:1100px){.backlog{position:static;max-height:none}}
.backlog.drop{box-shadow:inset 0 0 0 2px var(--pc);background:var(--pc-bg)}
.backlog header{display:flex;justify-content:space-between;align-items:center}
.backlog h3{font-size:1.02rem}
.blf{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.blf input[type=search]{grid-column:1/-1}
.blf select{grid-column:1/-1;font-size:.85rem;padding:4px 6px}
.blf label{grid-column:1/-1;display:flex;gap:6px;align-items:center;color:var(--muted)}
.blist{overflow-y:auto;display:grid;gap:6px;align-content:start;padding-right:2px}
@media (max-width:1100px){.blist{max-height:420px}}
.blwk{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:6px}
.chip.bl{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--pc)}
.chip.bl.ev{border-left-color:var(--ev)}
.chip.bl.cmpc{border-left-color:var(--cm);background:var(--cm-bg)}
.chip.bl.closed{opacity:.6}
.chip .cm{white-space:nowrap}
.fchips{display:flex;flex-wrap:wrap;gap:3px}
.fchip{font-size:.66rem;font-weight:600;padding:0 5px;border-radius:999px;background:var(--soft);color:var(--muted)}

/* data table */
.tbl-wrap{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--soft);white-space:nowrap;position:sticky;top:0;z-index:1}
tbody tr:hover{background:var(--soft)}
tbody tr.cmpc{background:var(--cm-bg)}
tbody tr.cmpc td:first-child{box-shadow:inset 4px 0 0 var(--cm)}
tbody tr.inactive{background:none}
tbody tr.inactive td{opacity:.5}
tbody tr.inactive td:first-child{box-shadow:inset 4px 0 0 var(--na)}
td input,td select{width:100%;font-size:.86rem;padding:4px 5px}
td.w-type{min-width:92px}td.w-date{min-width:140px}td.w-time{min-width:100px}td.w-title{min-width:220px}td.w-mid{min-width:140px}td.w-st{min-width:118px}td.w-link{min-width:160px}
select.s-done{background:var(--ok-bg);color:var(--ok);border-color:transparent;font-weight:600}
select.s-open{background:var(--wait-bg);color:var(--wait);border-color:transparent;font-weight:600}
select.s-late{background:var(--late-bg);color:var(--late);border-color:transparent;font-weight:600}
select.s-na{background:var(--na-bg);color:var(--na);border-color:transparent}
.x{background:none;border:none;color:var(--pc);font-size:.88rem;padding:0;font-weight:600}

/* pending */
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}
.pcol{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 12px;display:grid;gap:4px;align-content:start}
.pcol header{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.pcol h3{font-size:1rem}
.pill{font-size:.75rem;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--wait-bg);color:var(--wait);white-space:nowrap}
.pill.zero{background:var(--ok-bg);color:var(--ok)}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:5px 0;border-top:1px solid var(--soft)}
.prow:first-of-type{border-top:none}
.prow .pt{min-width:0;cursor:pointer}
.prow .pt b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.93rem}
.prow small{color:var(--muted)}
.prow select{font-size:.85rem;padding:3px 5px}
.lateword{color:var(--late);font-weight:700}

/* dialog */
dialog{border:none;border-radius:12px;padding:0;width:min(760px,calc(100vw - 24px));max-height:calc(100vh - 40px);background:var(--surface);color:var(--fg);box-shadow:0 20px 50px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(15,23,35,.5)}
.dlg{padding:18px 20px;display:grid;gap:14px}
.dlg .dhd{display:flex;justify-content:space-between;align-items:center;gap:10px}
.typesw{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;padding:2px;gap:2px;background:var(--soft)}
.typesw button{border:none;background:none;padding:5px 16px;border-radius:999px;font-weight:600;color:var(--muted)}
.typesw button[data-t="PC"][aria-pressed="true"]{background:var(--pc);color:#fff}
.typesw button[data-t="Event"][aria-pressed="true"]{background:var(--ev);color:#fff}
.typesw button[data-t="CM PC"][aria-pressed="true"]{background:var(--cm);color:var(--cm-fg)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.form label{display:grid;gap:3px;font-size:.82rem;color:var(--muted);font-weight:600}
.form .full{grid-column:1/-1}
.form input,.form select,.form textarea{color:var(--fg);font-size:.97rem;font-weight:400}
.title-in{font-size:1.2rem!important;font-weight:700!important}
.phase{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding-bottom:3px;margin-top:6px;border-bottom:1px solid var(--line)}
.srow{display:grid;grid-template-columns:minmax(0,1fr) 170px;gap:6px 12px;align-items:center;padding:5px 0}
.srow .sl{font-weight:600}
.srow .sl small{display:block;color:var(--muted);font-size:.8rem;font-weight:400}
.srow .lk{grid-column:1/-1}
.srow .lk input{width:100%;font-size:.88rem}
@media (max-width:560px){.form{grid-template-columns:1fr}.srow{grid-template-columns:1fr}}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.confirm{border:1px solid var(--late);background:var(--late-bg);padding:10px;border-radius:var(--r);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn.doneb{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{background:var(--late);border-color:var(--late);color:#fff}

/* sub-parts toggles */
.subparts{display:grid;gap:8px}
.sp{display:flex;flex-wrap:wrap;gap:8px}
.spb{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 13px;font-weight:600;font-size:.92rem}
.spb .tick{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--line);display:inline-grid;place-items:center;font-size:.72rem;line-height:1}
.spb[aria-pressed="true"]{background:var(--pc-bg);border-color:var(--pc);color:var(--pc)}
.spb[aria-pressed="true"] .tick{background:var(--pc);border-color:var(--pc);color:#fff}
.spb[aria-pressed="true"] .tick::after{content:"✓"}
td.w-ck{text-align:center;min-width:64px}
td.w-ck input{width:18px;height:18px;accent-color:var(--pc)}
th.ck{text-align:center;white-space:normal;min-width:64px;line-height:1.2}

/* setup */
.setup{max-width:620px;margin:20px auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;display:grid;gap:12px}
.setup label{display:grid;gap:4px;font-weight:600;font-size:.9rem}
.setup input{width:100%}
.err{color:var(--late);font-size:.9rem}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:.92rem;z-index:60;display:flex;gap:12px;align-items:center;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.toast button{background:none;border:none;color:inherit;text-decoration:underline;padding:0;font-weight:700}
</style>
</head>
<body>
<div class="topbar"><div class="in">
  <div><h1>Punjab Media Desk</h1><div class="sub">PCs and events on one calendar</div></div>
  <div class="actions">
    <button class="btn primary" id="btnNew" type="button">+ Add PC or Event</button>
    <button class="btn" id="btnExport" type="button">Export to Excel</button>
    <button class="btn" id="btnShare" type="button">Copy team link</button>
  </div>
</div></div>

<div class="wrap">
  <div class="navrow">
    <div class="navl">
    <div class="tabs" role="tablist" id="tabs">
      <button role="tab" data-v="calendar" aria-selected="true" type="button">Calendar</button>
      <button role="tab" data-v="pending" aria-selected="false" type="button">Pending<span class="count" id="pendCount" hidden></span></button>
      <button role="tab" data-v="data" aria-selected="false" type="button">Data</button>
    </div>
    <div class="tabs" role="tablist" aria-label="Filter by PC type" id="pcTabs">
      <button role="tab" data-f="minister" aria-selected="false" type="button">Minister PC<span class="pcn" id="pcn-minister"></span></button>
      <button role="tab" data-f="cm" aria-selected="false" type="button">CM PC<span class="pcn" id="pcn-cm"></span></button>
      <button role="tab" data-f="all" aria-selected="true" type="button">All<span class="pcn" id="pcn-all"></span></button>
    </div>
    <select id="pocF" aria-label="Filter by POC"><option value="">All POCs</option></select>
    </div>
    <div class="conn" id="conn"><i></i><span>Connecting…</span></div>
  </div>
  <main id="main"></main>
</div>

<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<div class="toast" id="toast" hidden></div>

<script>
/* ---------- Tracked items ---------- */
const DONE3=["Pending","Done","NA"], REC3=["Pending","Received","NA"], LIVE3=["Not needed","Pending","Done"];
const ADS=["None","Size TBD","Half page","Full page"];
const OVERALL=["Pending","Done","To be done by CM","Dropped"];
const ITEMS=[
  {k:"onePager",short:"OP",label:"One pager",owner:"Department",phase:"Before",opts:REC3,off:-1,when:a=>true},
  {k:"adCoord",short:"AD",label:"Ad coordinated with parent department",owner:"Parent department",phase:"Before",opts:DONE3,off:-1,when:a=>a.printAd&&a.printAd!=="None"},
  {k:"calendarPosted",short:"CAL",label:"Calendar posted (Ministers group, Media execution call)",owner:"",phase:"Before",opts:DONE3,off:-1,when:a=>true},
  {k:"live",short:"LV",label:"Live",owner:"",phase:"On the day",opts:LIVE3,off:0,when:a=>a.type==="Event"},
  {k:"bytes",short:"BY",label:"Bytes recorded",owner:"",phase:"On the day",opts:LIVE3,off:0,when:a=>a.type==="Event"},
  {k:"pr",short:"PR",label:"PR happened",owner:"Pritam",phase:"On the day",opts:DONE3,off:0,when:a=>true},

/* ---------- To schedule (activities without a date) ---------- */
const bl={q:"",sector:"",closed:false};
const MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
function weekKey(w){const m=String(w||"").match(/(\d)\w*\s+week\s+(\w{3})/i);if(m){let mo=MON[m[2].toLowerCase()]||0;if(mo<7)mo+=12;return mo*10+Number(m[1])}
  if(/anytime/i.test(w))return 900;if(/inaugurated/i.test(w))return 990;return 950}
const FMT_SHORT={"PC":"PC","Minister site visit":"Site visit","Event with Minister":"Event","Op-ed":"Op-ed","Print ad":"Ad","Beneficiary interaction":"Beneficiaries"};
/* Sub-parts of an activity (the Yes/No columns of the Media Calendar), stored as a comma list in "formats" */
const FORMATS=["PC","Minister site visit","Event with Minister","Op-ed","Print ad","Beneficiary interaction"];

function hasFmt(a,f){return fmtList(a).includes(f)}

function isPcEntry(a){return a.type==="PC"||hasFmt(a,"PC")}
function isCmPc(a){return isPcEntry(a)&&(hasFmt(a,"CM level")||a.status==="To be done by CM")}

function typeOf(a){return isCmPc(a)?"CM PC":a.type}
function typePatch(a,t){const rest=fmtList(a).filter(x=>x!=="CM level");
  if(t==="CM PC"){const p={formats:["CM level",...rest].join(", ")};if(!isCmPc(a))p.type="PC";return p}
  const p={type:t,formats:rest.join(", ")};if(a.status==="To be done by CM")p.status="Pending";return p}
function matchPcf(a,f){return f==="all"||(f==="cm"?isCmPc(a):isPcEntry(a)&&!isCmPc(a))}

    if(st.touch)st.timer=setTimeout(()=>begin(st,st.x,st.y),380);drag=st});
  el.addEventListener("click",e=>{if(suppressClick){suppressClick=false;e.preventDefault();return}if(touchOnly)openEdit(id)});
}
let lastY=0,scrollTimer=null;
function autoScroll(){if(!drag||!drag.active){clearInterval(scrollTimer);scrollTimer=null;return}
  const h=innerHeight,edge=70;let dy=0;if(lastY>h-edge)dy=Math.ceil((lastY-(h-edge))/3);else if(lastY<edge)dy=-Math.ceil((edge-lastY)/3);
  if(dy){scrollBy(0,dy);place(drag,drag.lx,lastY)}}
function begin(st,x,y){st.active=true;st.lx=x;lastY=y;if(!scrollTimer)scrollTimer=setInterval(autoScroll,30);st.el.classList.add("dragging");const g=st.el.cloneNode(true);g.classList.add("ghost-chip");g.classList.remove("dragging");document.body.append(g);st.ghost=g;place(st,x,y);
  try{st.el.setPointerCapture(st.pid)}catch(_){}if(navigator.vibrate)try{navigator.vibrate(15)}catch(_){}}
function place(st,x,y){st.ghost.style.left=(x-60)+"px";st.ghost.style.top=(y-14)+"px";document.querySelectorAll(".day.drop").forEach(n=>n.classList.remove("drop"));
  const t=document.elementFromPoint(x,y);const day=t&&t.closest(".day,.backlog");if(day)day.classList.add("drop");st.over=day?day.dataset.date:null}
document.addEventListener("pointermove",e=>{if(!drag||e.pointerId!==drag.pid)return;const dx=Math.abs(e.clientX-drag.x),dy=Math.abs(e.clientY-drag.y);
  if(!drag.active){if(drag.touch){if(dx+dy>10){clearTimeout(drag.timer);drag=null}return}if(dx+dy>6)begin(drag,e.clientX,e.clientY);else return}
  e.preventDefault();drag.lx=e.clientX;lastY=e.clientY;place(drag,e.clientX,e.clientY)},{passive:false});
document.addEventListener("touchmove",e=>{if(drag&&drag.active)e.preventDefault()},{passive:false});
function endDrag(e){if(!drag||(e&&e.pointerId!==drag.pid))return;clearTimeout(drag.timer);const st=drag;drag=null;if(!st.active)return;
  suppressClick=true;setTimeout(()=>suppressClick=false,300);st.el.classList.remove("dragging");st.ghost&&st.ghost.remove();
  document.querySelectorAll(".day.drop").forEach(n=>n.classList.remove("drop"));
  const a=state.acts.find(x=>x.id===st.id);
  if(a&&st.over!=null&&st.over!==(a.date||"")){const old=a.date||"";patch(a.id,{date:st.over});
    toast(st.over?`${old?"Moved":"Scheduled"} “${a.title||"Untitled"}” on ${fmt(st.over,{weekday:"short",day:"numeric",month:"short"})}`:`Moved “${a.title||"Untitled"}” back to To schedule`,()=>patch(a.id,{date:old}))}}
document.addEventListener("pointerup",endDrag);document.addEventListener("pointercancel",endDrag);

/* ---------- Data table ---------- */
function stCls(a,it){return "s-"+stateOf(a,it)}
function sel(id,opts,cur,cls){return `<select id="${id}" class="${cls||""}">${opts.map(o=>`<option value="${esc(o)}" ${o===cur?"selected":""}>${esc(OPT_LABEL[o]||o)}</option>`).join("")}</select>`}
function renderData(){
  main.innerHTML="";const vw=document.createElement("div");vw.className="view";
  const bar=document.createElement("div");bar.className="bar";
  bar.innerHTML=`<div class="left"><select id="dScope"><option value="month">${parse(state.month+"-01").toLocaleDateString("en-IN",{month:"long",year:"numeric"})}</option><option value="upcoming">Today onwards</option><option value="unscheduled">To schedule (no date)</option><option value="all">All entries</option></select><input type="search" id="dq" placeholder="Search heading, venue, minister" value="${esc(state.q)}"></div><div class="left"><a class="x" id="sheetLink" target="_blank" rel="noopener" hidden>Open the Google Sheet</a><button class="btn sm primary" id="dAdd" type="button">+ Add row</button></div>`;
  vw.append(bar);
  let rows=visible();
  if(state.dataScope==="month")rows=rows.filter(a=>a.date.slice(0,7)===state.month);
  if(state.dataScope==="upcoming")rows=rows.filter(a=>a.date>=TODAY);
  if(state.dataScope==="unscheduled")rows=rows.filter(a=>!a.date);
  const q=state.q.trim().toLowerCase();if(q)rows=rows.filter(a=>[a.title,a.venue,a.minister,a.district,a.context,a.sector,a.poc].join(" ").toLowerCase().includes(q));
  rows.sort((p,q2)=>(p.date+(p.time||"")).localeCompare(q2.date+(q2.time||"")));
  const cols=["Date","Time","Type","Heading","Sector","POC","Status","Target week",...FORMATS.map(f=>"ck:"+(FMT_SHORT[f]==="Event"?"Event w/ Minister":f)),"Minister / Dept","Venue","Print ad size","One pager","Ad coord.","Calendar posted","Live","Bytes","PR (Pritam)","Digital (AJ)","Digital link","Social (Akash)","Social link",""];
  const w=document.createElement("div");w.className="tbl-wrap";
  w.innerHTML=`<table><thead><tr>${cols.map(c=>c.startsWith("ck:")?`<th class="ck">${esc(c.slice(3))}</th>`:`<th>${c}</th>`).join("")}</tr></thead><tbody></tbody></table>`;
  const tb=w.querySelector("tbody");
  rows.forEach(a=>{const tr=document.createElement("tr");if(isClosed(a))tr.className="inactive";else if(isCmPc(a))tr.className="cmpc";const p="r-"+a.id+"-";
    const st=k=>{const it=ITEMS.find(i=>i.k===k);return it.when(a)?sel(p+k,it.opts,v(a,it),stCls(a,it)):`<span class="muted small">n/a</span>`};
    const inp=(f,t,ph)=>`<input type="${t||"text"}" id="${p}${f}" value="${esc(a[f])}" ${ph?`placeholder="${ph}"`:""}>`;
    tr.innerHTML=`<td class="w-date">${inp("date","date")}</td><td class="w-time">${inp("time","time")}</td><td class="w-type">${sel(p+"type",["PC","CM PC","Event"],typeOf(a))}</td>
      <td class="w-title">${inp("title")}</td><td class="w-mid">${inp("sector")}</td><td class="w-mid">${inp("poc")}</td>
      <td class="w-st">${sel(p+"status",OVERALL.includes(a.status)||!a.status?["",...OVERALL]:["",a.status,...OVERALL],a.status||"")}</td><td class="w-mid">${inp("week")}</td>
      ${FORMATS.map((f,i)=>`<td class="w-ck"><input type="checkbox" data-fmt="${esc(f)}" id="${p}fmt${i}" aria-label="${esc(f)}" ${hasFmt(a,f)?"checked":""}></td>`).join("")}<td class="w-mid">${inp("minister")}</td><td class="w-mid">${inp("venue")}</td>
      <td class="w-st">${sel(p+"printAd",ADS,a.printAd||"None")}</td>
      <td class="w-st">${st("onePager")}</td><td class="w-st">${st("adCoord")}</td><td class="w-st">${st("calendarPosted")}</td>
      <td class="w-st">${st("live")}</td><td class="w-st">${st("bytes")}</td><td class="w-st">${st("pr")}</td>
      <td class="w-st">${st("digital")}</td><td class="w-link">${inp("digitalLink","text","Link")}</td>
      <td class="w-st">${st("social")}</td><td class="w-link">${inp("socialLink","text","Link")}</td>
      <td><button class="x" type="button" data-open>Open</button></td>`;
    tr.querySelectorAll("input,select").forEach(el=>{const f=el.id.slice(p.length);
      if(el.dataset.fmt){el.addEventListener("change",()=>patch(a.id,toggleFmt(state.acts.find(x=>x.id===a.id),el.dataset.fmt,el.checked)));return}
      el.addEventListener("change",()=>{const val=el.value.trim();if(f==="type"){patch(a.id,typePatch(state.acts.find(x=>x.id===a.id),val));return}const extra=f==="printAd"?{formats:toggleFmt(a,"Print ad",val!=="None").formats}:{};patch(a.id,{[f]:val,...extra})})});
    tr.querySelector("[data-open]").onclick=()=>openEdit(a.id);tb.append(tr)});
  vw.append(w);
  if(!rows.length)vw.insertAdjacentHTML("beforeend",`<div class="empty">No entries ${state.dataScope==="month"?"this month":"here"} yet. Use “+ Add row” or double-click a day on the calendar.</div>`);
  else vw.insertAdjacentHTML("beforeend",`<div class="small muted">Each change saves to the Google Sheet when you leave the cell. You can also edit the Sheet directly; changes show up here within a minute.</div>`);
  main.append(vw);
  const sc=document.getElementById("dScope");sc.value=state.dataScope;sc.onchange=()=>{state.dataScope=sc.value;render()};
  const dq=document.getElementById("dq");dq.oninput=()=>{state.q=dq.value;clearTimeout(dq._t);dq._t=setTimeout(()=>{const pos=dq.selectionStart;renderData();const n=document.getElementById("dq");n.focus();n.setSelectionRange(pos,pos)},250)};
  document.getElementById("dAdd").onclick=()=>openNew(state.dataScope==="month"&&state.month!==TODAY.slice(0,7)?state.month+"-01":TODAY);
  if(cfg.sheet){const l=document.getElementById("sheetLink");l.href=cfg.sheet;l.hidden=false}
}

/* ---------- Pending ---------- */
function renderPending(){
  main.innerHTML="";const vw=document.createElement("div");vw.className="view";
  vw.insertAdjacentHTML("beforeend",`<div class="small muted">Everything still marked Pending, oldest first. Change the status here and it saves straight away. Click a heading to open the entry.</div>`);
  const g=document.createElement("div");g.className="pgrid";
  ITEMS.forEach(it=>{
    const list=visible().filter(a=>a.date&&!isClosed(a)&&it.when(a)&&isOpen(a,it)).map(a=>({a,due:addDays(a.date,it.off)})).sort((p,q)=>p.due.localeCompare(q.due));
    const col=document.createElement("section");col.className="pcol";
    col.innerHTML=`<header><h3>${esc(it.label)}</h3><span class="pill ${list.length?"":"zero"}">${it.owner?esc(it.owner)+" · ":""}${list.length}</span></header>`;
    if(!list.length)col.insertAdjacentHTML("beforeend",`<div class="empty small">All clear.</div>`);
    list.forEach(({a,due})=>{const r=document.createElement("div");r.className="prow";const late=due<TODAY?daysBetween(due,TODAY):0;
      r.innerHTML=`<div class="pt"><b>${esc(a.title||"Untitled")}</b><small>${typeTag(a)} ${fmt(a.date,{day:"numeric",month:"short"})}${late?` · <span class="lateword">${late} day${late>1?"s":""} late</span>`:""}</small></div>${sel("p-"+it.k+"-"+a.id,it.opts,"Pending",late?"s-late":"s-open")}`;
      r.querySelector("select").onchange=e=>patch(a.id,{[it.k]:e.target.value});
      r.querySelector(".pt").onclick=()=>openEdit(a.id);col.append(r)});
    g.append(col)});
  vw.append(g);main.append(vw);
}

/* ---------- Entry dialog ---------- */
const dlg=document.getElementById("dlg"),body=document.getElementById("dlgBody");
let openId=null,isNew=false,draft=null;
function openNew(date){if(!cfg)return;draft=blank("PC",date);if(state.pcf==="cm")draft.formats="CM level";isNew=true;openId=null;drawDialog();dlg.showModal();setTimeout(()=>{const t=document.getElementById("fTitle");t&&t.focus()},30)}
function openEdit(id){if(!state.acts.find(x=>x.id===id))return;isNew=false;openId=id;draft=null;drawDialog();if(!dlg.open)dlg.showModal()}
function cur(){return isNew?draft:state.acts.find(x=>x.id===openId)}
function setField(k,val){if(isNew){draft[k]=val;if(k==="type"||k==="printAd"||ITEMS.some(i=>i.k===k))drawDialog();return}patch(openId,{[k]:val});drawDialog()}
function drawDialog(){
  const a=cur();if(!a){dlg.close();return}
  let phase="",items="";
  applicable(a).forEach(it=>{if(it.phase!==phase){phase=it.phase;items+=`<div class="phase">${phase}</div>`}
    const s=stateOf(a,it);
    items+=`<div class="srow"><div class="sl">${esc(it.label)}<small>${it.owner?esc(it.owner)+" · ":""}${it.off===0?"on the day":it.off<0?"before the day":"day after"}${s==="late"?' · <span class="lateword">overdue</span>':""}</small></div>${sel("s-"+it.k,it.opts,v(a,it),"s-"+s)}${it.link?`<div class="lk"><input type="text" id="l-${it.k}" placeholder="Paste report link or reference" value="${esc(a[it.link]||"")}"></div>`:""}</div>`});
  body.innerHTML=`<div class="dhd"><div class="typesw" role="group" aria-label="Type"><button type="button" data-t="PC" aria-pressed="${typeOf(a)==="PC"}">PC</button><button type="button" data-t="CM PC" aria-pressed="${typeOf(a)==="CM PC"}">CM PC</button><button type="button" data-t="Event" aria-pressed="${typeOf(a)==="Event"}">Event</button></div><div style="display:flex;gap:8px">${isNew?"":`<button class="btn sm ${isDoneSt(a)?"":"doneb"}" type="button" id="dDone">${isDoneSt(a)?"Reopen":"Mark as Done"}</button>`}<button class="btn sm" type="button" id="dClose">Close</button></div></div>
  <div class="form">
    <label class="full">Heading<input type="text" class="title-in" id="fTitle" value="${esc(a.title)}" placeholder="${a.type==="PC"?"What is the PC about":"Event name"}"></label>
    <label title="Leave empty to keep it in the To schedule list">Date (optional)<input type="date" id="fDate" value="${a.date||""}"></label>
    <label>Time<input type="time" id="fTime" value="${esc(a.time)}"></label>
    <label>Minister / Department<input type="text" id="fMin" value="${esc(a.minister)}"></label>
    <label>Venue<input type="text" id="fVenue" value="${esc(a.venue)}"></label>
    <label>District<input type="text" id="fDist" value="${esc(a.district)}"></label>
    <label>Print ad<select id="fAd">${ADS.map(o=>`<option ${o===(a.printAd||"None")?"selected":""}>${o}</option>`).join("")}</select></label>
    <label class="full">${a.type==="Event"?"When, where, context":"Context"}<textarea id="fCtx">${esc(a.context)}</textarea></label>
    <label>Sector<input type="text" id="fSec" value="${esc(a.sector)}"></label>
    <label>POC<input type="text" id="fPoc" value="${esc(a.poc)}"></label>
    <label>Overall status<select id="fSt">${(OVERALL.includes(a.status)||!a.status?["",...OVERALL]:["",a.status,...OVERALL]).map(o=>`<option value="${esc(o)}" ${o===(a.status||"")?"selected":""}>${esc(o||"Not set")}</option>`).join("")}</select></label>
    <label>Target week<input type="text" id="fWk" value="${esc(a.week)}" placeholder="e.g. 2nd week Nov"></label>
    <label class="full">Timing note<textarea id="fTim" style="min-height:40px">${esc(a.timing)}</textarea></label>
  </div>
  <div class="subparts"><div class="phase">What this activity needs</div>
    <div class="sp" role="group" aria-label="What this activity needs">${FORMATS.map((f,i)=>`<button type="button" class="spb" id="sp-${i}" data-f="${esc(f)}" aria-pressed="${hasFmt(a,f)}"><span class="tick" aria-hidden="true"></span>${esc(f)}</button>`).join("")}</div>
    <div class="small muted">Tap to switch each one on or off. Print ad also sets the Print ad field above.</div></div>
  <div>${items}</div>
  <div class="form"><label class="full">Remarks<textarea id="fRem">${esc(a.remarks)}</textarea></label></div>
  <div class="foot">${isNew?`<span class="small muted">You can change everything later.</span><button class="btn primary" type="button" id="dSave">Add to calendar</button>`:`<button class="btn sm" type="button" id="dDel">Delete</button><span class="small muted">Changes save as you go.</span>`}</div><div id="cf"></div>`;
  body.querySelector("#dClose").onclick=()=>dlg.close();
  const dDone=body.querySelector("#dDone");if(dDone)dDone.onclick=()=>toggleDone(openId);
  body.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{const p=typePatch(cur(),b.dataset.t);if(isNew)Object.assign(draft,p);else patch(openId,p);drawDialog()});
  const map={fTitle:"title",fDate:"date",fTime:"time",fMin:"minister",fVenue:"venue",fDist:"district",fAd:"printAd",fCtx:"context",fRem:"remarks",fSec:"sector",fPoc:"poc",fSt:"status",fWk:"week",fTim:"timing"};
  Object.entries(map).forEach(([id,k])=>{const el=body.querySelector("#"+id);el.addEventListener("change",()=>setField(k,el.value.trim()))});
  body.querySelectorAll(".spb").forEach(b=>b.onclick=()=>{const on=b.getAttribute("aria-pressed")!=="true";const p=toggleFmt(cur(),b.dataset.f,on);
    if(isNew){Object.assign(draft,p);drawDialog()}else{patch(openId,p);drawDialog()}const n=document.getElementById(b.id);n&&n.focus()});
  body.querySelector("#fAd").addEventListener("change",e=>{const a2=cur();const want=e.target.value!=="None";if(want!==hasFmt(a2,"Print ad")){const p=toggleFmt(a2,"Print ad",want);delete p.printAd;if(isNew)Object.assign(draft,p);else patch(openId,p);drawDialog()}});
  applicable(a).forEach(it=>{body.querySelector("#s-"+it.k).onchange=e=>setField(it.k,e.target.value);if(it.link)body.querySelector("#l-"+it.k).onchange=e=>setField(it.link,e.target.value.trim())});
  if(isNew)body.querySelector("#dSave").onclick=()=>{Object.entries(map).forEach(([id,k])=>draft[k]=body.querySelector("#"+id).value.trim());
    if(!draft.title){const t=body.querySelector("#fTitle");t.focus();t.placeholder="Add a heading first";return}
    const d=draft.date;save(draft);isNew=false;draft=null;dlg.close();toast(d?"Added to "+fmt(d,{day:"numeric",month:"short"}):"Added to To schedule");if(d)state.month=d.slice(0,7);render()};
  else body.querySelector("#dDel").onclick=()=>{const cf=body.querySelector("#cf");cf.innerHTML=`<div class="confirm"><span>Delete “${esc(a.title||"Untitled")}”?</span><button class="btn sm danger" type="button" id="dYes">Delete</button><button class="btn sm" type="button" id="dNo">Keep</button></div>`;
    cf.querySelector("#dYes").onclick=()=>{const copy=structuredClone(a);dlg.close();remove(a.id);toast("Deleted",()=>save(copy))};cf.querySelector("#dNo").onclick=()=>cf.innerHTML=""};
}
function refreshDialog(){const a=cur();if(!a||isNew)return;const f=document.activeElement;if(f&&body.contains(f)&&(f.tagName==="INPUT"||f.tagName==="TEXTAREA"))return;const fid=f&&f.id;drawDialog();if(fid){const n=document.getElementById(fid);n&&n.focus()}}
dlg.addEventListener("close",()=>{openId=null;isNew=false;draft=null});
document.getElementById("btnNew").onclick=()=>openNew(state.month===TODAY.slice(0,7)?TODAY:state.month+"-01");

/* ---------- Setup screen ---------- */
function showSetup(msg){
  main.innerHTML=`<div class="setup"><h2>Enter the desk key</h2>
  <p class="muted" style="margin:0">This calendar is for the Punjab Media Desk team. Enter the desk key you were given, or open the team link someone sent you and this step is skipped.</p>
  <label>Desk key<input type="text" id="cKey" value="${esc(cfg&&cfg.k||"")}" autocomplete="off"></label>
  <details><summary class="small muted" style="cursor:pointer">Advanced</summary>
  <div style="display:grid;gap:10px;margin-top:8px">
  <label>Web app URL<input type="url" id="cApi" value="${esc(cfg&&cfg.api||DEFAULT_API)}"></label>
  <label>Google Sheet link<input type="url" id="cSheet" value="${esc(cfg&&cfg.sheet||DEFAULT_SHEET)}"></label></div></details>
  ${msg?`<div class="err">${esc(msg)}</div>`:""}
  <div><button class="btn primary" id="cGo" type="button">Open calendar</button></div></div>`;
  document.getElementById("cKey").onkeydown=e=>{if(e.key==="Enter")document.getElementById("cGo").click()};
  document.getElementById("cGo").onclick=()=>{const api=document.getElementById("cApi").value.trim(),k=document.getElementById("cKey").value.trim(),sheet=document.getElementById("cSheet").value.trim();
    if(!/^https:\/\/script\.google\.com\//.test(api)||!k){showSetup("Enter the desk key.");return}
    cfg={api,k,sheet};storeCfg(cfg);loaded=false;setConn("Connecting…");refresh()};
}

/* ---------- Share and export ---------- */
document.getElementById("btnShare").onclick=async()=>{if(!cfg){toast("Connect to the Sheet first.");return}const link=OPEN_CFG?location.origin+location.pathname:teamLink();
  try{await navigator.clipboard.writeText(link);toast("Team link copied. Anyone with it can view and edit.")}catch(e){prompt("Copy this team link:",link)}};
function exportExcel(){
  if(typeof XLSX==="undefined"){toast("The Excel library did not load. Reload the page and try again.");return}
  const rows=state.acts.slice().sort((p,q)=>(p.date+(p.time||"")).localeCompare(q.date+(q.time||""))).map(a=>{const r={"Date":a.date||"To schedule","Day":a.date?parse(a.date).toLocaleDateString("en-IN",{weekday:"short"}):"","Time":a.time||"","Type":a.type,"Heading":a.title,"Sector":a.sector||"","POC":a.poc||"","Overall status":a.status||"","Target week":a.week||"","Timing note":a.timing||"","Suggested formats":a.formats||"","Minister / Department":a.minister||"","Venue":a.venue||"","District":a.district||"","Context":a.context||"","Print ad":a.printAd||"None"};
    ITEMS.forEach(it=>{r[it.label+(it.owner?" ("+it.owner+")":"")]=it.when(a)?(OPT_LABEL[v(a,it)]||v(a,it)):"n/a";if(it.link)r[it.label+" link"]=a[it.link]||""});r["Remarks"]=a.remarks||"";return r});
  const wb=XLSX.utils.book_new();const ws=rows.length?XLSX.utils.json_to_sheet(rows):XLSX.utils.aoa_to_sheet([["No entries yet"]]);
  const rg=ws["!ref"]&&XLSX.utils.decode_range(ws["!ref"]);if(rg)ws["!cols"]=Array.from({length:rg.e.c+1},()=>({wch:20}));
  XLSX.utils.book_append_sheet(wb,ws,"Media Desk");XLSX.writeFile(wb,"Punjab_Media_Desk_"+TODAY+".xlsx");
}
document.getElementById("btnExport").onclick=exportExcel;

/* ---------- Start ---------- */
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{state.view=b.dataset.v;render()});
document.querySelectorAll("#pcTabs button").forEach(b=>b.onclick=()=>{state.pcf=b.dataset.f;render()});
document.getElementById("pocF").onchange=e=>{state.poc=e.target.value;render()};
if(cfg){main.innerHTML=`<div class="empty">Loading the calendar from the Google Sheet…</div>`;refresh()}else{setConn("Not connected","bad");showSetup()}
setInterval(()=>{if(document.visibilityState==="visible")refresh()},30000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")refresh()});
</script>
</body>
